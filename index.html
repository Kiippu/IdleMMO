<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Guildwright</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap">
<style>
/* Guildwright: a guild-town ledger in pixel ink.
   Layout: one phone-width column (max 460px) on limewashed plaster. A sticky town-crier bar (purse, tokens, week, HP)
   carries the "now doing" strip; tab content scrolls beneath; a fixed five-tab bar sits at the bottom.
   Pixel-notched corners only on things you press; panels are flat sheets with a single rule.
   Color: plaster ground, paper sheets, woad-blue guild ink as the one accent, brass for coin, six rarity inks.
   Type: Pixelify Sans for display + numbers (sparingly), Atkinson Hyperlegible for reading, Silkscreen for tiny labels. */
:root {
  --plaster: #e2e5dc;
  --grain: rgba(40, 52, 70, .07);
  --paper: #f6f7f2;
  --sunk: #ebede5;
  --ink: #1b2030;
  --ink-2: #545b6b;
  --ink-3: #5d6474;
  --rule: #c6cabe;
  --rule-2: #d9dcd2;
  --woad: #2a479e;
  --woad-soft: #dfe5f5;
  --on-woad: #ffffff;
  --brass: #8a5e0a;
  --brass-fill: #e0ae3c;
  --hp: #c0392f;
  --focus: #17807c;
  --ok: #2b7640;
  --warn: #975a00;
  --bad: #b3261e;
  --scrim: rgba(20, 24, 34, .52);
  --shadow: rgba(27, 32, 48, .16);

  --r-common: #646a74;
  --r-uncommon: #287d3c;
  --r-rare: #1f5fc4;
  --r-epic: #8336bd;
  --r-legendary: #ad5a00;
  --r-mythic: #c21a4b;

  --f-display: "Pixelify Sans", "Silkscreen", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-label: "Silkscreen", system-ui, -apple-system, "Segoe UI", sans-serif;

  --t-xs: 11px; --t-sm: 13px; --t-md: 15px; --t-lg: 18px; --t-xl: 24px; --t-xxl: 32px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --col: 460px;
  --tabbar-h: 60px;
  --px: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px),
        calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plaster: #10141c; --grain: rgba(180, 200, 255, .045); --paper: #191f2a; --sunk: #141922;
    --ink: #ebe7da; --ink-2: #a3a8b4; --ink-3: #8a90a0; --rule: #2e3645; --rule-2: #232a36;
    --woad: #91a7ff; --woad-soft: #222c47; --on-woad: #0c1121; --brass: #eabf58; --brass-fill: #e0ae3c;
    --hp: #ff6a5d; --focus: #4dd0c7; --ok: #6ccf87; --warn: #f0b458; --bad: #ff7a70;
    --scrim: rgba(3, 5, 10, .66); --shadow: rgba(0, 0, 0, .45);
    --r-common: #a8aeb8; --r-uncommon: #69cf7a; --r-rare: #69a7ff; --r-epic: #c58bff; --r-legendary: #ffb547; --r-mythic: #ff668e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plaster: #10141c; --grain: rgba(180, 200, 255, .045); --paper: #191f2a; --sunk: #141922;
  --ink: #ebe7da; --ink-2: #a3a8b4; --ink-3: #8a90a0; --rule: #2e3645; --rule-2: #232a36;
  --woad: #91a7ff; --woad-soft: #222c47; --on-woad: #0c1121; --brass: #eabf58; --brass-fill: #e0ae3c;
  --hp: #ff6a5d; --focus: #4dd0c7; --ok: #6ccf87; --warn: #f0b458; --bad: #ff7a70;
  --scrim: rgba(3, 5, 10, .66); --shadow: rgba(0, 0, 0, .45);
  --r-common: #a8aeb8; --r-uncommon: #69cf7a; --r-rare: #69a7ff; --r-epic: #c58bff; --r-legendary: #ffb547; --r-mythic: #ff668e;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--plaster);
  background-image: radial-gradient(var(--grain) 1px, transparent 1.2px);
  background-size: 8px 8px;
  color: var(--ink);
  font: 400 var(--t-md)/1.45 var(--f-body);
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--paper);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
img.px { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--col); margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--woad); outline-offset: 2px; }

.eyebrow {
  font: 400 var(--t-xs)/1.2 var(--f-label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
}
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: var(--t-sm); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--rule);
  box-shadow: 0 6px 16px -12px var(--shadow);
}
.top .wrap { padding-block: 8px 10px; display: grid; gap: 8px; }
.crier { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand { font: 700 var(--t-lg)/1 var(--f-display); letter-spacing: .02em; color: var(--woad); margin-right: auto; white-space: nowrap; }
.purse { display: flex; align-items: center; gap: 4px; font: 500 var(--t-md)/1 var(--f-display); white-space: nowrap; }
.purse img { width: 16px; height: 16px; }
.purse.gold { color: var(--brass); }
.week { font: 400 var(--t-xs)/1 var(--f-label); color: var(--ink-2); white-space: nowrap; }
.hpline { display: flex; align-items: center; gap: 8px; }
.hpline img { width: 14px; height: 14px; }
.hpline .meter { flex: 1; }
.hpline .val { font: 500 var(--t-sm)/1 var(--f-display); min-width: 64px; text-align: right; }

/* pixel meters */
.meter {
  position: relative; height: 8px; background: var(--sunk); border: 1px solid var(--rule); overflow: hidden;
}
.meter > i {
  position: absolute; inset: 0; transform-origin: left center; transform: scaleX(var(--p, 0));
  background: var(--fill, var(--woad));
}
.meter::after { /* 4px segment ticks */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 5px, var(--paper) 5px 6px); opacity: .55;
}
.meter.hp { --fill: var(--hp); }
.meter.focus { --fill: var(--focus); }
.meter.xp { height: 6px; --fill: var(--woad); }
.meter.brass { --fill: var(--brass-fill); }
.meter.thin { height: 5px; }
.meter.big { height: 12px; }

/* now doing */
@keyframes bump { 40% { transform: translateY(-3px); } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
  font: 600 var(--t-md)/1 var(--f-display); letter-spacing: .02em; clip-path: var(--px);
  box-shadow: inset 0 -3px 0 var(--rule); white-space: nowrap; touch-action: manipulation;
}
.btn:hover { background: var(--sunk); }
.btn:active { box-shadow: inset 0 2px 0 var(--rule); transform: translateY(1px); }
.btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--woad), inset 0 -3px 0 var(--rule); }
.btn.primary { background: var(--woad); border-color: var(--woad); color: var(--on-woad); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:focus-visible { box-shadow: inset 0 0 0 2px var(--on-woad), inset 0 -3px 0 rgba(0,0,0,.25); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: var(--paper); }
.btn.ghost { border-color: var(--rule); box-shadow: none; color: var(--ink-2); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: var(--t-sm); }
.btn.tiny { min-height: 28px; padding: 0 8px; font-size: var(--t-sm); border-width: 2px; }
.btn.wide { width: 100%; }
.btn[disabled], .btn.is-off { opacity: .45; cursor: not-allowed; transform: none; }
.btn .sub { font: 400 var(--t-xs)/1 var(--f-body); opacity: .85; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--woad); font: 700 var(--t-sm)/1.2 var(--f-body); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 1px solid var(--rule);
  font: 400 10px/1.3 var(--f-label); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap;
  background: var(--paper);
}
.chip.num { font: 600 11px/1.3 var(--f-display); text-transform: none; letter-spacing: .02em; }
.chip.lock { color: var(--bad); border-color: currentColor; }
.chip.good { color: var(--ok); border-color: currentColor; }
.chip.warnc { color: var(--warn); border-color: currentColor; }
.chip.accent { color: var(--woad); border-color: currentColor; }
.chip img { width: 12px; height: 12px; }

/* rarity ink */
.r-common { --rc: var(--r-common); }
.r-uncommon { --rc: var(--r-uncommon); }
.r-rare { --rc: var(--r-rare); }
.r-epic { --rc: var(--r-epic); }
.r-legendary { --rc: var(--r-legendary); }
.r-mythic { --rc: var(--r-mythic); }
.rink { color: var(--rc); }
.rchip { color: var(--rc); border-color: var(--rc); background: color-mix(in srgb, var(--rc) 10%, var(--paper)); }

/* ---------- main ---------- */
main.view { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
main.view > .wrap { padding-block: 16px 8px; display: grid; gap: 20px; }
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font: 600 var(--t-lg)/1.2 var(--f-display); }
.lede { display: grid; gap: 4px; }
.lede h1 { font: 700 var(--t-xl)/1.1 var(--f-display); }
.lede p { color: var(--ink-2); font-size: var(--t-sm); }
.sheetish { background: var(--paper); border: 1px solid var(--rule); }
.empty { padding: 14px; border: 1px dashed var(--rule); color: var(--ink-2); font-size: var(--t-sm); background: var(--paper); }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--ink); clip-path: var(--px); background: var(--paper); }
.seg button { border: 0; background: none; min-height: 44px; padding: 0 8px; font: 600 var(--t-sm)/1.1 var(--f-display); color: var(--ink-2); }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--woad); }

/* ---------- shared components moved here from screen sections (used by several screens) ---------- */
.io { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--t-sm); }
.io .arrow { color: var(--ink-3); font-family: var(--f-display); }
.stack { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.stack img { width: 22px; height: 22px; }
.stack .q { font: 500 var(--t-sm)/1 var(--f-display); }
.stack .q.short { color: var(--bad); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: var(--t-sm); }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; }
.reason { font-size: var(--t-sm); color: var(--bad); }
.hint { font-size: var(--t-sm); color: var(--ink-2); }
.toggles { display: grid; gap: 8px; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: var(--t-sm); }
.tog .seg { min-width: 150px; }
.tog .seg button { min-height: 44px; font-size: 12px; }
.switch {
  position: relative; width: 46px; height: 26px; margin-block: 9px; border: 2px solid var(--ink); background: var(--sunk); clip-path: var(--px); flex: none;
}
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: var(--ink-3); transition: transform .12s steps(3); }
.switch[aria-checked="true"] { background: var(--woad); border-color: var(--woad); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-woad); }
.switch[disabled] { opacity: .4; }
.switch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--woad); }
.g0 { --g: #8a8478; } .g1 { --g: #6f8fa8; } .g2 { --g: #3f9a6b; } .g3 { --g: #c99a1d; } .g4 { --g: #d8572f; }
.gname { font-weight: 700; }
.affixes { display: flex; flex-wrap: wrap; gap: 4px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px dashed var(--bad); font-size: var(--t-sm); }
.confirm p { flex: 1 1 160px; }
.rows { display: grid; border: 1px solid var(--rule); background: var(--paper); }
.rowi { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; min-width: 0; }
.rowi + .rowi { border-top: 1px solid var(--rule-2); }
.rowi > img { width: 30px; height: 30px; grid-row: span 2; align-self: start; }
.rowi .rn { font-weight: 700; min-width: 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.rowi .rs { grid-column: 2; font-size: var(--t-xs); color: var(--ink-2); min-width: 0; }
.rowi .rp { text-align: right; display: grid; gap: 2px; justify-items: end; }
.rowi .rp b { font: 600 var(--t-md)/1 var(--f-display); color: var(--brass); white-space: nowrap; }
.rowi .rp small { font-size: 10px; color: var(--ink-3); white-space: nowrap; }
.rowi .ra { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.form { display: grid; gap: 10px; padding: 12px; background: var(--paper); border: 1px solid var(--rule); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font: 400 var(--t-xs)/1.2 var(--f-label); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.field select, .field input {
  width: 100%; min-height: 40px; padding: 6px 8px; background: var(--sunk); border: 2px solid var(--rule); border-radius: 0; min-width: 0;
}
.field select:focus, .field input:focus { outline: none; border-color: var(--woad); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: inline-grid; grid-template-columns: 32px 44px 32px; align-items: stretch; border: 2px solid var(--ink); clip-path: var(--px); height: 32px; }
.stepper button { border: 0; background: var(--sunk); font: 700 16px/1 var(--f-display); padding: 0; }
.stepper output { display: grid; place-items: center; font: 600 var(--t-sm)/1 var(--f-display); background: var(--paper); border-inline: 2px solid var(--ink); }
.toss-root { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.toss-root .toss { position: absolute; left: 0; top: 0; width: 28px; height: 28px; will-change: transform; }
.toss-root .glow { filter: drop-shadow(0 0 3px var(--rc)) drop-shadow(0 0 8px var(--rc)); }
.toss-root .pip { position: absolute; width: 20px; height: 20px; animation: pip 1.2s ease-out forwards; }
@keyframes pip { 0% { opacity: 0; } 20%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toss-root .pip { animation-duration: 1.2s !important; } }
main.view > .wrap { gap: 16px; }
.sec { gap: 8px; }
.stack .q .short { color: var(--bad); }
.btn.pulse { animation: cta 1.4s ease-in-out infinite; }
.gdot { display: inline-block; width: 8px; height: 8px; background: var(--g); flex: none; }
.gchip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-xs); color: var(--ink-2); }
.rowi { padding: 8px 12px; }
.rowi.brow { grid-template-columns: 30px minmax(0, 1fr) auto; }
.rowi.brow > img { grid-row: span 2; }
.rowi.brow > .btn { grid-row: 1 / span 2; grid-column: 3; }
.rowi.brow .rs { grid-column: 2 / 3; }
.rowi.dim .rn, .rowi.dim > img { opacity: .72; }
.rowi.slim .rs .linkish { min-height: 28px; padding: 0; }
.rowi .rp b { color: var(--brass); }
.chip-btn { min-height: 44px; padding: 0 10px; border: 1px solid var(--rule); background: var(--paper); font: 600 var(--t-sm)/1 var(--f-body); color: var(--ink-2); cursor: pointer; }
.stepper { height: 44px; grid-template-columns: 40px 44px 40px; }
.lvups { display: grid; gap: 6px; }
.lvups > div { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: var(--t-md); }
.sheet-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 0; margin-top: 4px; background: var(--paper); border-top: 1px solid var(--rule-2); }
.sheet-foot .btn { flex: 1 1 auto; min-height: 48px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { min-height: 44px; padding: 0 14px; border: 2px solid var(--rule); background: var(--paper); font: 600 var(--t-sm)/1 var(--f-body); color: var(--ink-2); cursor: pointer; }
.fchip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 2px solid var(--ink);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs .wrap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar-h); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button {
  border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 4px; color: var(--ink-3);
  font: 400 10px/1 var(--f-label); text-transform: uppercase; letter-spacing: .04em; position: relative; min-width: 0;
}
.tabs button svg { width: 22px; height: 22px; shape-rendering: crispEdges; fill: currentColor; }
.tabs button[aria-current="page"] { color: var(--woad); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--woad); }
.tabs button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--woad); }
.tabs .dot { position: absolute; top: 9px; right: calc(50% - 18px); width: 7px; height: 7px; background: var(--hp); }

/* ---------- toasts ---------- */
.toasts {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 40;
  display: grid; justify-items: center; gap: 6px; pointer-events: none;
  padding-left: var(--gut-l); padding-right: var(--gut-r);
}
.toast {
  max-width: min(420px, 100%); display: flex; gap: 8px; align-items: center; padding: 8px 12px;
  background: var(--ink); color: var(--paper); font-size: var(--t-sm); clip-path: var(--px);
  animation: toast-in .18s ease-out; pointer-events: auto;
}
.toast img { width: 22px; height: 22px; }
.toast b { font-weight: 700; }
.toast.lvl { background: var(--woad); color: var(--on-woad); }
.toast.warn { background: var(--bad); color: var(--paper); }
.toast.r { background: var(--paper); color: var(--ink); border: 2px solid var(--rc); }
.toast.out { opacity: 0; transform: translateY(6px); transition: .2s; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ---------- sheets ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  width: 100%; max-width: var(--col); max-height: 88%; overflow: auto; background: var(--paper); border-top: 2px solid var(--ink);
  padding: 16px var(--gut-r) calc(16px + env(safe-area-inset-bottom, 0px)) var(--gut-l); display: grid; gap: 14px;
  animation: rise .2s ease-out; overscroll-behavior: contain;
}
.sheet h2 { font: 700 var(--t-xl)/1.1 var(--f-display); }
.sheet .sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet .grade-table { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px 12px; font-size: var(--t-sm); align-items: center; }
.sheet .grade-table .gnm { display: flex; align-items: center; gap: 6px; }
.sheet .grade-table .gnm i { width: 8px; height: 8px; background: var(--g); display: inline-block; }
.loot { display: flex; flex-wrap: wrap; gap: 6px; }
.loot .chip { font-size: 11px; padding: 3px 6px; color: var(--ink); text-transform: none; font-family: var(--f-body); letter-spacing: 0; }
.loot .chip img { width: 18px; height: 18px; }
.big-result { font: 700 var(--t-xxl)/1 var(--f-display); }
.big-result.won { color: var(--ok); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }

/* ---------- craft reveal ---------- */
.reveal {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; align-content: center; gap: 18px;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 30%, transparent) 0, transparent 60%), var(--scrim);
  padding: 24px var(--gut-r) 24px var(--gut-l); animation: fade .15s;
}
.rv-card { width: 236px; height: 344px; max-width: 100%; perspective: 900px; }
.rv-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.reveal.flipped .rv-inner { transform: rotateY(180deg); }
.rv-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; clip-path: var(--px); border: 3px solid var(--ink); }
.rv-back {
  background:
    repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in srgb, var(--brass-fill) 35%, transparent) 10px 12px),
    repeating-linear-gradient(-45deg, transparent 0 10px, color-mix(in srgb, var(--brass-fill) 35%, transparent) 10px 12px),
    #1d1a24;
  display: grid; place-items: center;
}
.rv-back::before { /* rarity colour bleeding in from the edges */
  content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 0 var(--rc); animation: bleed .95s ease-in forwards;
}
.rv-back img { width: 72px; height: 72px; opacity: .9; }
.rv-back .crest { font: 700 var(--t-md)/1 var(--f-display); color: #f2d68a; letter-spacing: .1em; position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; }
.reveal:not(.flipped) .rv-card { animation: rattle .95s steps(10) forwards; }
@keyframes bleed { 0% { box-shadow: inset 0 0 0 0 var(--rc); } 60% { box-shadow: inset 0 0 26px 6px var(--rc); } 100% { box-shadow: inset 0 0 70px 40px var(--rc); } }
@keyframes rattle { 0%, 30% { transform: none; } 40% { transform: translate(-2px, 0) rotate(-1deg); } 50% { transform: translate(2px, -1px) rotate(1deg); }
  60% { transform: translate(-3px, 1px) rotate(-1.5deg); } 70% { transform: translate(3px, 0) rotate(1.5deg); } 80% { transform: translate(-3px, -1px) rotate(-2deg); }
  90% { transform: translate(3px, 1px) rotate(2deg) scale(1.03); } 100% { transform: scale(1.04); } }
.rv-front {
  transform: rotateY(180deg); background: var(--paper); border-color: var(--rc);
  display: grid; align-content: start; justify-items: center; gap: 7px; padding: 16px 12px; text-align: center;
  box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--rc) 25%, var(--paper));
}
.rv-front .rv-rar { font: 700 var(--t-xl)/1 var(--f-display); color: var(--rc); letter-spacing: .04em; }
.rv-front .rv-art { width: 92px; height: 92px; display: grid; place-items: center; background: color-mix(in srgb, var(--rc) 14%, var(--paper)); }
.rv-front .rv-art img { width: 72px; height: 72px; }
.rv-front .rv-name { font-weight: 700; line-height: 1.25; text-wrap: balance; }
.rv-front .rv-stats { font-size: var(--t-xs); color: var(--ink-2); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
.rv-front .affixes { justify-content: center; }
.rv-front .pityflag { font: 400 9px/1 var(--f-label); text-transform: uppercase; color: var(--ink-2); }
.reveal .rv-hint { font: 400 var(--t-xs)/1 var(--f-label); color: #f3f1ea; background: rgba(12, 10, 18, .7); padding: 4px 8px; text-transform: uppercase; letter-spacing: .06em; }
.sparks { position: absolute; inset: 0; pointer-events: none; }
.sparks i { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; background: var(--rc); opacity: 0; }
.reveal.flipped .sparks i { animation: spark .7s ease-out forwards; }
@keyframes spark { 0% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))); } }

.fatal { padding: 24px; font-size: var(--t-md); }

@media (min-width: 700px) {
  main.view > .wrap { padding-block: 24px 12px; }
  .top .wrap, main.view > .wrap, .tabs .wrap { border-inline: 1px solid var(--rule-2); }
  main.view > .wrap { background: color-mix(in srgb, var(--plaster) 70%, var(--paper)); min-height: 70vh; }
}
@media (max-width: 370px) {
  .mats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats b { font-size: var(--t-md); }
  .tactic span { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .rv-back::before { animation: none; }
}
@media (max-width: 380px) {
  .skill { padding: 8px; column-gap: 6px; }
  .skill .nm { font-size: 12px; }
}
.sb .meter.hp { --fill: var(--hp); }

/* ---------- v2: toss + crew ---------- */
/* =========================================================================================
   v3 UX sweep: calmer chrome, bigger targets, completion juice
   ========================================================================================= */
[hidden] { display: none !important; }
.eyebrow { font-size: 11px; }
.chip { font-size: 11px; }
.btn { min-height: 44px; }
.btn.small, .btn.tiny { min-height: 44px; padding: 0 12px; font-size: var(--t-sm); }
.btn.big { min-height: 48px; font-size: var(--t-md); }
.linkish { min-height: 44px; display: inline-flex; align-items: center; cursor: pointer; }
.gold-t { color: var(--brass); }
.bad { color: var(--bad); }
.upc { color: var(--ok); font-weight: 700; }
.dn { color: var(--ink-3); }
.reason { color: var(--warn); }

/* header */
.top .wrap { padding-block: 4px 6px; gap: 4px; }
.crier { gap: 14px; min-height: 24px; }
.purse { font-size: var(--t-md); }
.purse.hp { color: var(--ink); }
.purse.hp.low { color: var(--hp); }
.week { margin-left: auto; font-size: 11px; }
#topHpBar { height: 5px; }
.now {
  position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--sunk); border: 1px solid var(--rule); padding: 5px 8px 5px 5px; min-height: 60px;
}
.scene-wrap { position: relative; width: 96px; height: 48px; flex: none; box-shadow: 0 0 0 1px var(--rule); }
.scene-wrap.steady { box-shadow: 0 0 0 1px var(--rule), 0 0 calc(2px + 10px * var(--steady, 0)) calc(1px * var(--steady, 0)) color-mix(in srgb, var(--focus) calc(100% * var(--steady, 0)), transparent); }
.now .scene { display: block; width: 96px; height: 48px; background: var(--paper); }
.floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floats .fl {
  position: absolute; bottom: 4px; transform: translateX(-50%); white-space: nowrap; font: 700 13px/1 var(--f-display);
  text-shadow: 0 1px 0 #120e14, 1px 0 0 #120e14, -1px 0 0 #120e14, 0 -1px 0 #120e14, 0 2px 2px rgba(0,0,0,.4);
  animation: flt .9s ease-out forwards;
}
.floats .fl.big { font-size: 14px; animation-duration: 1.3s; }
@keyframes flt { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -24px); } }
.now-main { min-width: 0; display: grid; gap: 3px; }
.now .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.now .l1 img { width: 16px; height: 16px; flex: none; }
.now .l1 b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.now .l2 { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--t-sm); color: var(--ink-2); }
.now .l2 > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-variant-numeric: tabular-nums; }
.steady-chip { flex: none; font: 600 11px/1 var(--f-display); color: var(--focus); border: 1px solid currentColor; padding: 2px 5px; }
.hintchip { border: 1px dashed var(--woad); background: var(--woad-soft); color: var(--woad); font: 700 12px/1.2 var(--f-body); padding: 4px 8px; min-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; cursor: pointer; }
.now #nowBar { height: 6px; }
.now #nowBar.flash > i { background: var(--paper); filter: brightness(1.6); }
.now #nowBar.flash { box-shadow: 0 0 0 1px var(--woad); }
.now.idle .l1 b { color: var(--ink-2); }
.now.assisting { border-color: var(--brass-fill); }
.now.assisting .l1 b { color: var(--brass); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--paper); clip-path: var(--px); cursor: pointer; }
.iconbtn:hover { background: var(--sunk); }
.iconbtn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--woad); }
.stopsq { width: 12px; height: 12px; background: var(--bad); }
.now .go { padding: 0 12px; }
.lvbanner {
  position: absolute; inset: 0 0 0 108px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  background: var(--woad); color: var(--on-woad); font-size: var(--t-sm);
}
.lvbanner b { font: 700 var(--t-lg)/1.1 var(--f-display); display: block; }
.lvbanner small { opacity: .85; }
.lvbanner .linkish { color: var(--on-woad); min-height: 24px; padding: 0; text-decoration: underline; }
.lvbanner.pop img { animation: lvpop .5s ease-out; }
@keyframes lvpop { 40% { transform: scale(1.4) rotate(-8deg); } }
body.raiding .now, body.sheet-open .now, body.revealing .now { display: none; }
img.wig { animation: wig .42s steps(6) 1; }
img.wig2 { animation: wig2 .6s steps(8) 1; }
@keyframes wig { 20% { transform: rotate(-14deg) scale(1.15); } 45% { transform: rotate(12deg) scale(1.15); } 70% { transform: rotate(-6deg); } 100% { transform: none; } }
@keyframes wig2 { 15% { transform: rotate(-20deg) scale(1.4); } 40% { transform: rotate(18deg) scale(1.4); } 65% { transform: rotate(-10deg) scale(1.2); } 100% { transform: none; } }

/* tabs */
.tabs button { font-size: 11px; }
.tabs .badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 4px; background: var(--hp); color: #fff; font: 700 11px/18px var(--f-body); text-align: center; border-radius: 9px; letter-spacing: 0; }
.tabs svg.bump { animation: tbump .15s ease-out; }
@keyframes tbump { 50% { transform: scale(1.25); } }

/* toasts: one at a time, docked above the tab bar */
.toasts { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); }
.toast { max-height: 40px; padding: 6px 12px; overflow: hidden; }

/* reveal: louder */
.reveal .rays { position: absolute; left: 50%; top: 46%; width: 760px; height: 760px; margin: -380px 0 0 -380px; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 45%, transparent) 0 8deg, transparent 8deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 15%, transparent 62%); mask: radial-gradient(circle, #000 15%, transparent 62%); animation: spin 14s linear infinite; }
.reveal.flipped .rays { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.rv-front { background: linear-gradient(170deg, color-mix(in srgb, var(--rc) 38%, var(--paper)) 0%, var(--paper) 62%); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--rc) 45%, var(--paper)), 0 0 40px color-mix(in srgb, var(--rc) 60%, transparent); }
.rv-front .rv-rar { font-size: 32px; text-shadow: 0 2px 0 color-mix(in srgb, var(--rc) 30%, transparent); }
.rv-front .rv-art { background: color-mix(in srgb, var(--rc) 22%, var(--paper)); }
.rv-front .rv-name { color: var(--ink); }
.rv-front .rv-stats { font: 600 var(--t-sm)/1.2 var(--f-display); color: var(--ink); gap: 4px 12px; }
.rv-front .pityflag { font: italic 400 12px/1.2 var(--f-body); text-transform: none; color: var(--ink-2); }
.rv-card { cursor: pointer; position: relative; z-index: 1; }
.rv-actions { display: flex; gap: 10px; position: relative; z-index: 1; }
.rv-actions .btn { min-height: 48px; min-width: 120px; }
.sparks i { width: 7px; height: 7px; }

@media (prefers-reduced-motion: reduce) {
  .reveal .rays { animation: none !important; }
  .floats .fl { animation: fltrm 1s linear forwards !important; animation-duration: 1s !important; }
  @keyframes fltrm { 0%, 80% { opacity: 1; transform: translate(-50%, -10px); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  .btn.pulse { animation: none !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--woad) 35%, transparent); }
}
@media (max-width: 380px) {
  .now { grid-template-columns: 96px minmax(0, 1fr) auto; gap: 8px; }
  .crier { gap: 10px; }
}

/* ---------- shell v4: header clock, five-tab bar, generic badges ---------- */
.week { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.week.live { color: var(--woad); font-weight: 700; }
.tabs .wrap { padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.tabs button { letter-spacing: .02em; }
.tabs .badge.is-dot { min-width: 8px; width: 8px; height: 8px; padding: 0; top: 8px; left: calc(50% + 9px); font-size: 0; }

/* QA fixes */
.switch::before { content: ""; position: absolute; inset: -10px -4px; }
.vstep { display: inline-flex; align-items: center; gap: 6px; }
.hintchip { max-width: 100%; }
.now .l2 { min-width: 0; }
.hintchip { white-space: normal; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ==== ui/crew.css ==== */
/* screen: crew */
.log { display: grid; border: 1px solid var(--rule); background: var(--paper); }
.log > div { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; padding: 7px 10px; font-size: var(--t-sm); align-items: baseline; }
.log > div + div { border-top: 1px solid var(--rule-2); }

.lk-craft { --kc: var(--r-epic); } .lk-level { --kc: var(--woad); } .lk-combat { --kc: var(--hp); } .lk-market { --kc: var(--brass); }
.lk-raid { --kc: var(--r-legendary); } .lk-warn { --kc: var(--bad); }
.danger-zone { display: grid; gap: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }

.lk-info { --kc: var(--rule); }

.cw-i { color: var(--ink-3); }

.cw-assist, .cw-tr, .cw-avs { min-height: 44px; }

/* ==== ui/kit.css ==== */
/* screen: kit */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--paper); }
.stats > div { padding: 8px 4px; text-align: center; display: grid; gap: 2px; }
.stats > div + div { border-left: 1px solid var(--rule-2); }
.stats b { font: 600 var(--t-lg)/1 var(--f-display); }
.stats .eyebrow { font-size: 9px; }
.stats .pw b { color: var(--woad); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot {

}

.slot.broken img { filter: grayscale(1); opacity: .6; }
.provisions { display: grid; gap: 6px; }

.mats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mat {

  border: 1px solid var(--rule); min-width: 0; text-align: center;
}
.mat:hover { border-color: var(--ink-3); }
.mat img { width: 32px; height: 32px; }
.mat .ct { position: absolute; top: 3px; right: 4px; font: 600 var(--t-sm)/1 var(--f-display); }
.mat .mn { font-size: 11px; line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.3em; }
.gradebar { display: flex; width: 100%; height: 4px; gap: 1px; }
.gradebar i { display: block; height: 100%; flex: var(--n) 0 0; background: var(--g); min-width: 0; }
.mat .tag { position: absolute; top: 3px; left: 4px; width: 6px; height: 6px; background: var(--ok); }
.gearlist { display: grid; gap: 6px; }
.gear { background: var(--paper); border: 1px solid var(--rule); box-shadow: inset 3px 0 0 var(--rc); min-width: 0; }
.gear-top { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px 8px 12px; background: none; border: 0; text-align: left; }
.gear-top img { width: 36px; height: 36px; grid-row: span 2; }
.gear-top .gn { font-weight: 700; color: var(--rc); min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.gear-top .gs { grid-column: 2; font-size: var(--t-xs); color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; }
.gear-top .gd { grid-row: span 2; display: grid; gap: 4px; justify-items: end; width: 64px; }
.gear-top .gd .meter { width: 64px; height: 5px; }
.gear-top .gd small { font: 500 10px/1 var(--f-display); color: var(--ink-2); }
.gear.equipped .gear-top { background: color-mix(in srgb, var(--rc) 6%, transparent); }
.gear-body { border-top: 1px solid var(--rule-2); padding: 10px 12px; display: grid; gap: 10px; }
.mat .gdot { position: absolute; top: 5px; left: 5px; }
.mat .tag { display: none; }
.gear-top { grid-template-columns: 36px minmax(0, 1fr) auto; min-height: 52px; }
.gear-top .gd { width: auto; min-width: 0; }
.gear-top .gd .meter { width: 56px; }
.gear-top .up { font: 700 12px/1 var(--f-display); color: var(--ok); white-space: nowrap; }
.gear-top .eqtag { font: 400 11px/1 var(--f-label); text-transform: uppercase; color: var(--rc); }
.gear.group .gear-top.grp { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 4px 10px 4px 0; }
.gear.group .gt-hit { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 6px 0 6px 12px; background: none; border: 0; text-align: left; min-width: 0; cursor: pointer; }
.gear.group .gt-hit img { grid-row: span 2; width: 36px; height: 36px; }
.gear.group .gt-hit .gn { color: var(--ink); font-weight: 700; }
.gear.group .gt-hit .gs { grid-column: 2; font-size: var(--t-xs); color: var(--ink-2); display: flex; gap: 8px; }
.gear-body .gearlist { gap: 4px; }
.gear-body { padding: 8px 12px 10px; gap: 8px; }
/* ---- loadouts + picker ---- */
.kseg { width: 100%; }
.kseg button { flex: 1; min-height: 44px; }
.ktags { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; max-width: 100%; }

.ktagrow { gap: 6px; }
.kcats .fchip { min-height: 44px; }
.knote { padding: 8px 12px; border: 2px solid var(--warn); background: var(--paper); font-size: var(--t-sm); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.lo.incomplete { box-shadow: inset 3px 0 0 var(--bad); }
.lo { --rc: var(--ink-3); }

.lo-top { width: 100%; display: grid; gap: 6px; padding: 10px 12px; background: none; border: 0; text-align: left; min-height: 44px; }
.lo-top .ln { font-weight: 700; overflow-wrap: anywhere; }
.lo-top .lc { display: flex; flex-wrap: wrap; gap: 4px; }
.mini { display: flex; gap: 3px; }
.mini i { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--rc, var(--rule)); background: var(--sunk); }

.lslots { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.slot { cursor: pointer; }

.krole .rowi { grid-template-columns: 0 minmax(0, 1fr) auto; padding: 6px 12px; }
.kpick { max-height: 52vh; overflow-y: auto; }
.pk { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px 4px 12px; }

/* ==== ui/market.css ==== */
/* screen: market */
.deal { color: var(--ok); font-weight: 700; }
.pricey { color: var(--warn); }
.fair { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: var(--t-sm); align-items: center; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.strip .tile { flex: none; width: 52px; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; background: var(--sunk); border: 2px solid var(--rule); font: 600 12px/1 var(--f-display); cursor: pointer; }
.strip .tile.sel { border-color: var(--woad); background: var(--woad-soft); }

/* QA fix round: 44px targets */
.seg button, .fchip, .linkish, .chip-btn { min-height: 44px; }
.rowi .btn.small, .gpick, .empty .btn { min-height: 44px; }

/* ==== ui/raid.css ==== */
/* screen: raid (J3). Everything is prefixed rd- except the check colour classes. */
.ck-mitigation { --ck: #4f7fd6; } .ck-healing { --ck: #3fa66a; } .ck-damage { --ck: #d4573c; }
.ck-food { --ck: #c99a2e; } .ck-consumables { --ck: #8a63c9; } .ck-supply { --ck: var(--brass-fill); }
.ckdot { display: inline-block; width: 8px; height: 8px; background: var(--ck, var(--ink-3)); flex: none; }
.rd { display: grid; gap: 14px; min-width: 0; }
.rd h3 { font: 600 var(--t-md)/1.2 var(--f-display); }
.rd .eyebrow + * { min-width: 0; }
.rd .ok { color: var(--ok); } .rd .warn { color: var(--warn); } .rd .bad { color: var(--bad); } .rd .brass { color: var(--brass); }
.rd-ico { width: 1em; height: 1em; fill: currentColor; shape-rendering: crispEdges; flex: none; }
.rd-card { background: var(--paper); border: 1px solid var(--rule); padding: 12px; display: grid; gap: 10px; min-width: 0; }
.rd-sec { display: grid; gap: 8px; min-width: 0; }

/* header */
.rd-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.rd-ht { display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
.rd-ht h2 { font: 700 var(--t-xl)/1.1 var(--f-display); overflow-wrap: anywhere; }
.rd-back { flex: 0 0 100%; gap: 6px; margin-bottom: -6px; }
.rd-back .rd-ico { width: 8px; height: 10px; }
.rd-count { font-size: var(--t-sm); padding: 4px 8px; }

/* boss card */
.rd-boss { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
.rd-boss .portrait { width: 96px; height: 96px; display: grid; place-items: center; background: var(--bossbg, var(--sunk)); border: 1px solid var(--rule); }
.rd-boss .bi { display: grid; gap: 8px; min-width: 0; }
.rd-boss .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.rd-ladder { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rd-ladder li { width: 14px; height: 14px; border: 2px solid var(--rule); background: var(--paper); }
.rd-ladder li.killed { background: var(--ink-3); border-color: var(--ink-3); }
.rd-ladder li.current { background: var(--bad); border-color: var(--ink); }
.rd-phases { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rd-phases li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: var(--t-sm); }
.rd-phases li b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rd-phases li span { font-size: var(--t-xs); color: var(--ink-2); }

/* boss HP bar: red = left, brass = dealt this weekend, hatched = carried over */
.rd-hp { position: relative; height: 14px; background: var(--sunk); border: 1px solid var(--rule); }
.rd-hp i { position: absolute; top: 0; bottom: 0; }
.rd-hp .hl { left: 0; width: calc(var(--a) * 100%); background: var(--hp); transition: width .2s linear; }
.rd-hp .wk { left: calc(var(--a) * 100%); width: calc((var(--b) - var(--a)) * 100%); background: var(--brass-fill); }
.rd-hp .old { left: calc(var(--b) * 100%); right: 0; background: repeating-linear-gradient(135deg, var(--rule) 0 2px, transparent 2px 5px); }
.rd-hp .tk { top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.sw { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--rule); }
.sw.wk { background: var(--brass-fill); }
.sw.old { background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 4px); }
.rd-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.rd-carry { margin-top: -4px; }
.rd-chests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rd-chests > div { display: grid; gap: 2px; padding: 6px 8px; background: var(--sunk); border: 1px solid var(--rule-2); font-size: var(--t-sm); min-width: 0; }
.rd-chests > div.new { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--paper)); }
.rd-chests b { font-weight: 700; }

/* prep card + kv lists */
.rd-kv { display: grid; gap: 6px; margin: 0; }
.rd-kv > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: var(--t-sm); }
.rd-kv dt { font: 400 var(--t-xs)/1.2 var(--f-label); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.rd-kv dd { margin: 0; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.rd-prepc.is-locked { border-color: var(--ok); }
.rd-done { justify-items: start; }

/* readiness + generic bars */
.rd-msg { font: 700 var(--t-md)/1.25 var(--f-display); }
.rd-msg.warn { color: var(--warn); } .rd-msg.ok { color: var(--ok); }
.rd-bars { display: grid; gap: 6px; }
.rd-bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: var(--t-sm); }
.rd-bar .meter { --fill: var(--ck, var(--woad)); height: 10px; }
.rd-bar b { text-align: right; font: 600 var(--t-sm)/1 var(--f-display); }
.rd-bar.short > span { color: var(--warn); font-weight: 700; }
.rd-last { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; text-align: left; padding: 8px 12px; min-height: 44px; background: var(--paper); border: 1px solid var(--rule); font-size: var(--t-sm); color: var(--ink); cursor: pointer; }
.rd-last .linkish { grid-row: 1 / span 2; grid-column: 2; }
.rd-proto { display: grid; gap: 6px; padding: 10px; border: 1px dashed var(--rule); }

/* prep: roles, loadouts, rules, pouch */
.rd-roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.rd-role { display: grid; gap: 4px; justify-items: start; text-align: left; padding: 8px 10px; min-height: 76px; background: var(--paper); border: 2px solid var(--rule); clip-path: var(--px); min-width: 0; color: var(--ink); position: relative; }
.rd-role::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ck); }
.rd-role b { font: 600 var(--t-md)/1.1 var(--f-display); }
.rd-role .num { font: 500 var(--t-sm)/1 var(--f-display); color: var(--ink-2); }
.rd-role[aria-pressed="true"] { border-color: var(--woad); background: var(--woad-soft); }

.rd-opts { display: grid; border: 1px solid var(--rule); background: var(--paper); }

.rd-opt + .rd-opt { border-top: 1px solid var(--rule-2); }
.rd-opt b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rd-opt[aria-pressed="true"] { background: var(--woad-soft); }

.rd-rule { display: grid; gap: 6px; }
.rd-rule > label, .rd-rule > .lbl { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: var(--t-sm); }
.rd-rule input[type="range"] { width: 100%; accent-color: var(--woad); height: 44px; margin: -8px 0; }
.rd-ends { display: flex; justify-content: space-between; }
.rd-tactics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rd-tac { display: grid; gap: 4px; align-content: start; text-align: left; padding: 8px; min-height: 84px; background: var(--paper); border: 2px solid var(--rule); clip-path: var(--px); min-width: 0; color: var(--ink); }
.rd-tac b { font: 600 var(--t-sm)/1.1 var(--f-display); }
.rd-tac span { font-size: 11px; line-height: 1.3; color: var(--ink-2); }
.rd-tac[aria-pressed="true"] { border-color: var(--woad); background: var(--woad-soft); }
.rd-tac[aria-pressed="true"] b { color: var(--woad); }
.rd-tok { grid-template-columns: minmax(0, 1fr) auto 44px; align-items: center; }
.rd-tok .faint { text-align: right; }
.rd-pi { grid-template-columns: 30px minmax(0, 1fr) auto; }
.rd-pi > .stepper, .rd-pi > .btn-row { grid-column: 3; grid-row: 1 / span 2; }
.rd-pi .stepper button[disabled] { opacity: .35; }

/* summary + tiers + cta */
.rd-sum ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rd-sum li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: var(--t-sm); }
.rd-sum li i { width: 10px; height: 10px; background: var(--ok); }
.rd-sum li.bad i { background: var(--bad); }
.rd-sum li.bad b { color: var(--bad); }
.rd-sum li b { font: 600 var(--t-sm)/1.2 var(--f-display); text-align: right; }
.rd-low { min-height: 44px; cursor: pointer; }
.rd-tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rd-tiers > div { display: grid; gap: 2px; padding: 8px; border: 1px solid var(--rule); border-top: 4px solid var(--tc, var(--rule)); background: var(--paper); }
.t-bronze { --tc: #b0703a; } .t-silver { --tc: #9aa3b2; } .t-gold { --tc: var(--brass-fill); } .t-none { --tc: var(--rule); }
.rd-tiers b { font: 600 var(--t-md)/1 var(--f-display); }
.rd-cta { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 5; display: grid; gap: 6px; padding-top: 10px; background: linear-gradient(transparent, var(--plaster) 26%); }
.rd-warn { margin: 0; padding: 8px 10px; list-style: none; display: grid; gap: 2px; font-size: var(--t-sm); color: var(--warn); background: var(--paper); border: 1px solid currentColor; }
.rd-lockbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: color-mix(in srgb, var(--ok) 12%, var(--paper)); border: 2px solid var(--ok); font-size: var(--t-sm); color: var(--ink); }
.rd-lockbar > .rd-ico { color: var(--ok); width: 14px; height: 16px; }
.rd-lockbar > span { flex: 1 1 180px; }
.rd-ro { border-style: dashed; }
.rd-pouchro { display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* fight */
.rd-cv { width: 100%; aspect-ratio: 16 / 9; display: block; background: #15111a; border: 2px solid var(--ink); max-width: 100%; }
.rd-fbars { gap: 10px; }
.rd-fhp { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.rd-fhp b, .rd-you b { text-align: right; font: 600 var(--t-sm)/1 var(--f-display); }
.rd-cur { display: grid; gap: 4px; padding: 8px; background: var(--sunk); border-left: 4px solid var(--ck, var(--rule)); }
.rd-curh { display: flex; justify-content: space-between; gap: 8px; font: 600 var(--t-sm)/1.2 var(--f-display); }
.rd-curh b { color: var(--brass); }
.rd-cur .meter { --fill: var(--ck, var(--woad)); }
.rd-auras { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; align-items: center; }
.rd-auras .chip { border-color: var(--ck); color: var(--ink); }
.rd-you { display: grid; gap: 8px; }
.rd-you > div { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.rd-mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border: 1px solid var(--rule-2); }
.rd-mini > div { padding: 6px 8px; display: grid; gap: 2px; }
.rd-mini > div + div { border-left: 1px solid var(--rule-2); }
.rd-mini dt { font: 400 10px/1.2 var(--f-label); text-transform: uppercase; color: var(--ink-2); }
.rd-mini dd { margin: 0; font: 600 var(--t-md)/1 var(--f-display); }
.rd-fmsg { font: 600 var(--t-sm)/1.3 var(--f-body); min-height: 1.3em; color: var(--ink-2); }

/* recap */
.rd-moment { padding: 0; gap: 0; overflow: hidden; }
.rd-moment .rd-cv { border: 0; border-bottom: 2px solid var(--ink); }
.rd-moh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; }
.rd-moh > div { display: grid; gap: 2px; min-width: 0; }
.rd-moh .btn .rd-ico { width: 8px; height: 10px; }
.rd-priv { display: inline-flex; gap: 4px; align-items: center; }
.rd-priv .rd-ico { width: 10px; height: 11px; }
.rd-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: var(--t-sm); min-width: 0; }
.rd-line > div { display: grid; gap: 2px; min-width: 0; }
.rd-line > .muted { white-space: nowrap; }
.rd-tier { display: grid; gap: 6px; }
.rd-tier .rd-line b { font: 700 var(--t-md)/1 var(--f-display); color: var(--tc); }
.rd-tier.t-silver .rd-line b { color: var(--ink-2); }
.rd-tbar { position: relative; height: 10px; background: var(--sunk); border: 1px solid var(--rule); }

  const rarityDef = (id) => rarities()[rarityIdx(id)] || RARITY_DEFAULTS[0];

  E.fmt = function (n) {
    n = Number(n);

  E.isGearCraft = (actionId) => isGearCraft(action(actionId));
  E.SLOTS = SLOTS.slice();

  // ---------------------------------------------------------------- headless smoke test
  E._test = function (opts) {
    opts = opts || {};
    const say = opts.silent ? () => {} : (m) => console.log('[engine test] ' + m);
    const assert = (c, m) => { if (!c) throw new Error('Engine test failed: ' + m); };
    const finite = (s) => {
      ['gold', 'tokens', 'week', 'hp', 'focus'].forEach((k) => assert(isFinite(s[k]), k + ' not finite: ' + s[k]));
      Object.keys(s.inv).forEach((id) => s.inv[id].forEach((x) => assert(x >= 0 && Number.isInteger(x), 'bad inv count ' + id)));
      s.gear.forEach((g) => assert(isFinite(g.dur) && isFinite(g.maxDur) && g.dur >= 0, 'bad gear dur'));
      Object.keys(s.skills).forEach((k) => assert(isFinite(s.skills[k].xp), 'xp nan ' + k));
      assert(s.log.length <= LOG_CAP, 'log too long');
    };
    const runTicks = (s, until, maxSec) => { let t = 0; const evs = []; while (t < maxSec && !until(evs, s)) { E.tick(s, 0.25, { visible: true }).forEach((e) => evs.push(e)); t += 0.25; } return evs; };
    assert(E.xpForLevel(1) === 0 && E.xpForLevel(2) === 83 && E.xpForLevel(99) === 13034431, 'xp curve');
    assert(E.levelFor(0) === 1 && E.levelFor(83) === 2 && E.levelFor(1e9) === num(cfg().maxLevel, 99), 'levelFor');
    E.save(null); E.load();
    const s = E.newState(); finite(s);
    assert(Object.keys(s.skills).length === skillDefs().length, 'skills missing');
    assert(s.hp === E.playerStats(s).maxHp, 'starting hp');
    assert(s.market.listings.length >= 12, 'market listings');
    assert(s.supply.requests.length >= 6, 'supply requests');
    // gather 20
    const gather = allActions().filter((a) => a.kind === 'gather' && num(a.level, 1) <= 1);
    assert(gather.length, 'no level-1 gather');
    let r = E.start(s, gather[0].id); assert(r.ok, 'start gather: ' + r.reason);
    let ev = runTicks(s, (e) => e.filter((x) => x.type === 'complete').length >= 20, 3600);
    assert(ev.filter((x) => x.type === 'complete').length >= 20, 'gathered 20');
    say(`gathered 20x ${gather[0].id}; ${E.itemCount(s, Object.keys(gather[0].outputs)[0])} in bag`);
    // feed a refine: grant inputs of the first level-1 refine
    const refine = allActions().find((a) => a.kind === 'refine' && num(a.level, 1) <= 1);
    if (refine) {
      Object.keys(refine.inputs || {}).forEach((id) => addItem(s, id, 1, refine.inputs[id] * 10));
      r = E.start(s, refine.id); assert(r.ok, 'start refine: ' + r.reason);
      ev = runTicks(s, (e) => !s.active, 3600);
      assert(ev.filter((x) => x.type === 'complete').length >= 10, 'refined 10');
      assert(ev.some((x) => x.type === 'stopped'), 'refine stops when out');
      say(`refined ${refine.id} until out of inputs`);
    }
    // craft 50 gear
    const craft = allActions().filter((a) => isGearCraft(a)).sort((a, b) => a.level - b.level)[0];
    assert(craft, 'no gear craft');
    Object.keys(craft.inputs || {}).forEach((id) => addItem(s, id, 2, craft.inputs[id] * 50));
    s.skills[craft.skill].xp = Math.max(s.skills[craft.skill].xp, E.xpForLevel(num(craft.level, 1)));
    const po = E.procOdds(s, craft.id);
    assert(po && Math.abs(po.odds.reduce((a, o) => a + o.chance, 0) - 1) < 1e-9, 'odds sum to 1');
    r = E.start(s, craft.id); assert(r.ok, 'start craft: ' + r.reason);
    ev = runTicks(s, (e) => !s.active, 20000);
    const crafts = ev.filter((x) => x.type === 'craft');
    assert(crafts.length === 50, 'crafted 50 (got ' + crafts.length + ')');
    const byR = {}; crafts.forEach((c) => { byR[c.rarity] = (byR[c.rarity] || 0) + 1; });
    assert(crafts.some((c) => rarityIdx(c.rarity) >= 2) || num(cfg().pityThreshold, 40) > 50, 'pity should guarantee a rare+ by 50');
    say(`crafted 50 ${craft.id}: ${JSON.stringify(byR)}`);
    // gear ops
    const loose = s.gear.filter((g) => !isEquipped(s, g.uid));
    assert(E.gearName(loose[0]).length > 0, 'gearName');
    assert(E.equip(s, loose[0].uid).ok, 'equip');
    const fc = E.fuseCandidates(s);
    if (fc.length) { r = E.fuse(s, fc[0].itemId); assert(r.ok && r.gear, 'fuse'); }
    const sv = s.gear.find((g) => !isEquipped(s, g.uid));
    if (sv) { r = E.salvage(s, sv.uid); assert(r.ok, 'salvage'); }
    const eq = s.gear.find((g) => isEquipped(s, g.uid)); eq.dur = 1;
    assert(E.repairCost(s, eq.uid).gold > 0, 'repair cost'); s.gold += 1000; assert(E.repair(s, eq.uid).ok, 'repair');
    // re-equip a weapon
    const weap = s.gear.find((g) => item(g.itemId).slot === 'weapon'); if (weap) E.equip(s, weap.uid);
    // combat
    const combat = allActions().filter((a) => a.kind === 'combat').sort((a, b) => a.level - b.level)[0];
    assert(combat, 'no combat');
    r = E.start(s, combat.id); assert(r.ok, 'start combat: ' + r.reason);
    ev = runTicks(s, (e) => e.filter((x) => x.type === 'kill').length >= 10 || !s.active, 3600);
    assert(ev.some((x) => x.type === 'kill' || x.type === 'faint'), 'combat produced kills');
    say(`combat: ${ev.filter((x) => x.type === 'kill').length} kills, ${ev.filter((x) => x.type === 'eat').length} eats, hp ${Math.round(s.hp)}`);
    E.stop(s);
    // market
    const l = s.market.listings[0]; s.gold += 5000;
    r = E.buy(s, l.id, 1); assert(r.ok, 'buy: ' + r.reason);
    const anyId = Object.keys(s.inv)[0]; const gr = s.inv[anyId].findIndex((x) => x > 0);
    r = E.list(s, anyId, gr, 1, 2); assert(r.ok, 'list: ' + r.reason);
    const before = s.gold; runTicks(s, () => !s.market.mine.length, 600);
    assert(s.market.mine.length === 0 && s.gold > before, 'cheap listing sold');
    assert(E.list(s, anyId, gr, 999999, 1).ok === false, 'list too many fails');
    // estimate
    const est = E.gatherEstimate(s, Object.keys(gather[0].outputs)[0]); assert(est > 0, 'gatherEstimate');
    // donate
    const req = s.supply.requests[0]; addItem(s, req.itemId, 0, 60);
    const q = E.supplyQuote(s, req.itemId, 60); r = E.donate(s, req.itemId, 60);
    assert(r.ok && r.coins === q.coins, 'donate');
    assert(E.supplyQuote(s, req.itemId, 10).coins <= Math.floor(req.rate * 10 * 0.5) + 1, 'diminishing returns');
    // raid
    E.setRaidRules(s, { eatAt: 0.9, stance: 'nonsense', tokens: 9999 });
    assert(s.raid.rules.eatAt === 0.8 && s.raid.rules.stance === 'balanced' && s.raid.rules.tokens === s.tokens, 'rules clamp');
    const pv = E.raidPreview(s); assert(pv.boss && Array.isArray(pv.advice), 'raidPreview');
    const wk = s.week; r = E.runRaid(s);
    assert(r.ok && r.timeline.length >= 6 && r.timeline.length <= RAID_FRAMES && r.result && r.recap && s.week === wk && s.raid.resolvedWeek === wk, 'runRaid: ' + r.reason);
    r.timeline.forEach((f) => assert(isFinite(f.bossHpPct) && isFinite(f.playerHpPct) && f.t >= 0 && f.t <= 1, 'frame finite'));
    assert(r.result.leaderboard.length <= 8 && r.result.leaderboard.some((e) => e.you), 'leaderboard');
    say(`raid: dealt ${r.result.damage}, share ${(r.result.sharePct * 100).toFixed(2)}%, boss ${E.fmt(r.result.bossHpBefore)} -> ${E.fmt(r.result.bossHpAfter)}, ate ${JSON.stringify(r.result.eaten)}`);
    // crew: posting
    assert(s.crew && s.crew.members.length >= 12 && s.crew.members.filter((m) => m.skill).length >= 4, 'crew members');
    s.crew.jobs = [];
    let cev = E.tick(s, 0.25);
    assert(cev.filter((x) => x.type === 'jobPosted').length >= CREW_MIN_JOBS && s.crew.jobs.length >= CREW_MIN_JOBS, 'jobs posted');
    s.crew.nextPostIn = 0.1; const nBefore = s.crew.jobs.length; cev = E.tick(s, 0.25);
    assert(nBefore >= CREW_MAX_JOBS || cev.some((x) => x.type === 'jobPosted'), 'job posted on timer');
    assert(s.crew.jobs.length <= CREW_MAX_JOBS, 'job cap');
    assert(E.crewJobs(s).every((j) => j.action && j.station && j.canAssist && isFinite(j.etaSec) && j.outputItemId), 'crewJobs shape');
    // crew: level lock
    const hard = allActions().filter((a) => isJobAction(a) && E.skillLevel(s, a.skill) < num(a.level, 1)).sort((a, b) => b.level - a.level)[0];
    if (hard) {
      const hj = postJob(s, hard.id);
      assert(!E.canAssist(s, hj.id).ok && !E.assist(s, hj.id).ok && !(s.active && s.active.jobId === hj.id), 'level-locked job refused');
      s.crew.jobs = s.crew.jobs.filter((j) => j !== hj);
    }
    // crew: assist start/stop
    const job = postJob(s, craft.id); job.qty = 6;
    r = E.assist(s, job.id); assert(r.ok && s.active && s.active.jobId === job.id, 'assist start: ' + r.reason);
    assert(E.activeInfo(s).kind === 'assist' && E.activeInfo(s).owner === job.owner, 'activeInfo assist');
    assert(E.crewJobs(s).find((j) => j.id === job.id).assisting, 'crewJobs assisting flag');
    E.stop(s); assert(s.active === null, 'assist stop');
    r = E.assist(s, job.id); assert(r.ok, 'assist again');
    const xpBefore = s.skills[craft.skill].xp, mBefore = num(s.mastery[craft.id], 0), gBefore = s.gold;
    ev = runTicks(s, (e) => e.some((x) => x.type === 'jobDone' && x.jobId === job.id), 600);
    const assists = ev.filter((x) => x.type === 'assist' && x.jobId === job.id);
    const done = ev.find((x) => x.type === 'jobDone' && x.jobId === job.id);
    assert(assists.length > 0 && done, 'assist crafts + jobDone');
    assert(Math.abs(s.skills[craft.skill].xp - xpBefore - assists.reduce((a, x) => a + x.xp, 0)) < 1e-6 && assists[0].xp > 0, 'assist xp');
    assert(num(s.mastery[craft.id], 0) - mBefore === assists.length, 'assist mastery');
    assert(assists.every((x) => x.rarity && x.items.length), 'gear job rolls rarity');
    assert(!ev.some((x) => x.type === 'complete'), 'no complete events for assist crafts');
    assert(done.assisted === assists.length && done.tip > 0 && s.gold >= gBefore + done.tip, 'tip paid');
    assert(s.active === null && ev.some((x) => x.type === 'stopped' && x.reason === 'Job finished.'), 'job finish stops assist');
    assert(!s.crew.jobs.some((j) => j.id === job.id), 'finished job removed');
    say(`assist: ${assists.length} crafts for ${job.owner}, ${assists.reduce((a, x) => a + x.xp, 0)} xp, tip ${done.tip}g`);
    // crew: offline assist (at offlineRate)
    const job2 = postJob(s, craft.id); job2.qty = 20; E.assist(s, job2.id);
    s.lastSeen = Date.now() - 3600 * 1000;
    const offA = E.applyOffline(s, Date.now());
    assert(offA.summary.assisted > 0 && offA.summary.xp[craft.skill] > 0, 'offline assist xp');
    // crew: v1 save migration
    const v1 = JSON.parse(JSON.stringify(s)); delete v1.crew; v1.active = { actionId: gather[0].id, progress: 1 };
    const mv = migrate(v1);
    assert(mv && mv.crew && mv.crew.members.length >= 12 && mv.crew.jobs.length >= CREW_MIN_JOBS && mv.active && !mv.active.jobId, 'v1 save migrates crew');
    const v1b = JSON.parse(JSON.stringify(s)); delete v1b.crew; v1b.active = { actionId: craft.id, progress: 0, jobId: 'gone' };
    assert(migrate(v1b).active === null, 'stale jobId dropped on migrate');
    finite(s);
    // offline
    E.start(s, gather[0].id); s.lastSeen = Date.now() - 13 * 3600 * 1000;
    const t0 = Date.now(); const off = E.applyOffline(s, Date.now());
    assert(off.seconds === num(cfg().offlineCapSec, 43200), 'offline cap');
    assert(Date.now() - t0 < 2000, 'offline fast');
    say(`offline ${E.fmtTime(off.seconds)}: ${JSON.stringify(off.summary.items)}`);
    // save round trip via migrate
    const back = migrate(JSON.parse(JSON.stringify(s))); assert(back && back.gold === s.gold, 'migrate round trip');
    assert(migrate({ junk: true }) === null, 'corrupt save rejected');
    finite(s);
    assert(E.fmt(1234) === '1.2k' && E.fmtTime(252) === '4m 12s' && E.fmtTime(7500) === '2h 5m', 'formatters');
    testV4(assert, say);
    say('all checks passed');
    return true;
  };

  // ---------------------------------------------------------------- v4 checks

    if (mine.length) h += '<span class="eyebrow">Your requests</span><div class="rows">' + mine.map((r) => '<div class="rowi slim"><span></span>'.replace('<span></span>', r.itemId ? itemImg(r.itemId, 24) : '') + '<span class="rn">' + (r.qty || 1) + '× ' + esc(nm(r)) + '</span><span class="chip ' + (r.status === 'approved' ? 'good' : r.status === 'denied' ? 'lock' : '') + '">' + (r.status === 'pending' ? 'Waiting' : esc(r.status)) + '</span></div>').join('') + '</div>';
    if (pend.length) h += '<span class="eyebrow">Crewmates ask</span><div class="rows">' + pend.map((r) => '<div class="rowi"><span></span>'.replace('<span></span>', r.itemId ? itemImg(r.itemId, 30) : '') + '<span class="rn"><b>' + esc(r.who) + '</b> · ' + (r.qty || 1) + '× ' + esc(nm(r)) + '</span><span class="ra"><button class="btn small primary" data-act="crew:answer" data-id="' + esc(r.id) + '" data-yes="1">Approve</button><button class="btn small ghost" data-act="crew:answer" data-id="' + esc(r.id) + '">Deny</button></span></div>').join('') + '</div>';

  }

    h += '<button class="linkish cw-link" data-act="crew:perms" aria-expanded="' + open + '">Your permissions as ' + esc(rankName(rankId())) + ' ' + (open ? '▴' : '▾') + '</button>';
    if (open) h += '<div class="rows cw-perms">' + PERMS.map(([k, n]) => {

      '<div class="field"><label for="cwHour">At</label><select id="cwHour" data-in="crewSchedHour"' + (cs.ok ? '' : ' disabled') + '>' + Array.from({ length: 24 }, (_, i) => '<option value="' + i + '"' + (i === dr.hour ? ' selected' : '') + '>' + String(i).padStart(2, '0') + ':00</option>').join('') + '</select></div></div>' +

  }

  // ---- feed + the old personal log
  function vFeed() {

    let h = '<div class="filters" role="group" aria-label="Filter feed">' + FEED_FILTERS.map(([k, n]) => '<button class="fchip" data-act="crew:feedF" data-id="' + k + '" aria-pressed="' + (f[0] === k) + '">' + n + '</button>').join('') + '</div>';
