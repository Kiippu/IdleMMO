    if (!feed.length) return h + '<div class="empty">Quiet so far. Vault moves, role changes, payouts and requisition fills are written here.</div>';
    return h + '<div class="log cw-feed">' + feed.map((e) => '<div class="cwk-' + esc(e.kind) + '"><span>' + rarityWords(e.text || '') + '</span><time>' + ago(e.t) + '</time></div>').join('') + '</div>';
  }
  function vLog() {
    const f = LOG_FILTERS.find((x) => x[0] === ui.logFilter) || LOG_FILTERS[0];
    const log = (S.log || []).filter((e) => !f[2] || f[2].includes(e.kind));
    const merged = [];
    log.forEach((e) => { const last = merged[merged.length - 1]; if (last && last.text === e.text && last.kind === e.kind) last.n++; else merged.push({ t: e.t, kind: e.kind, text: e.text, n: 1 }); });
    let h = '<div class="filters" role="group" aria-label="Filter log">' + LOG_FILTERS.map(([k, n]) => '<button class="fchip" data-act="logFilter" data-id="' + k + '" aria-pressed="' + (f[0] === k) + '">' + n + '</button>').join('') + '</div>';
    if (!merged.length) h += '<div class="empty">Quiet so far. Crafts, level-ups, sales and raids are written here.</div>';
    else h += '<div class="log">' + merged.map((e) => '<div class="lk-' + esc(e.kind) + '"><span>' + (e.n > 1 ? '<b class="num">' + e.n + '×</b> ' : '') + rarityWords(e.text) + '</span><time>' + ago(e.t) + '</time></div>').join('') + '</div>';
    h += '<section class="danger-zone"><span class="eyebrow">Settings</span>' + matPrefRow() + '<p class="hint">Progress saves in this browser every 10 seconds. Up to 12 hours of offline work is credited when you return.</p>';
    if (ui.confirm === 'reset') h += '<div class="confirm"><p>Erase this save and start a new guildwright from scratch?</p><button class="btn small danger solid" data-act="reset">Erase save</button><button class="btn small ghost" data-act="cancelConfirm">Keep playing</button></div>';
    else h += '<div class="btn-row"><button class="btn small ghost danger" data-act="askReset">Reset save</button></div>';
    return h + '</section>';
  }

  function render(ctx) {
    sync(ctx);
    const seg = ui.crewSeg;
    let h = vHead() + '<div class="seg" role="group" aria-label="Crew section">' + SEGS.map(([k, n]) => '<button data-act="crew:seg" data-id="' + k + '" aria-pressed="' + (seg === k) + '">' + n + '</button>').join('') + '</div>';
    h += seg === 'vault' ? vVault() : seg === 'members' ? vMembers() : seg === 'feed' ? vFeed() : vReq();
    return h;
  }

  // ---- sheets
  function bagItems() { return Object.keys(S.inv || {}).filter((id) => count(id) > 0).sort((a, b) => item(a).name.localeCompare(item(b).name)); }
  function stepper(key, val, id) {
    return '<span class="stepper"><button type="button" data-act="crew:step" data-k="' + key + '" data-d="-1" aria-label="Fewer">−</button><output class="num" id="' + id + '">' + val + '</output><button type="button" data-act="crew:step" data-k="' + key + '" data-d="1" aria-label="More">+</button></span>';
  }
  function showSheet(html, key) {
    if (ui.sheet === key) { const sh = document.querySelector('#sheetRoot .sheet'); if (sh) { sh.innerHTML = html; return; } }
    openSheet(html, key);
  }
  function depSheet() {
    const d = ui.crewDep, list = bagItems();
    if (!list.length) { showSheet('<div class="sheet-head"><h2>Deposit to vault</h2></div><div class="empty">Your bag is empty.</div>' + sheetFoot('<button class="btn wide" data-act="closeSheet" data-autofocus>Close</button>'), 'crewDep'); return; }
    if (!list.includes(d.itemId)) { d.itemId = list[0]; d.grade = null; }
    const g = S.inv[d.itemId] || [];
    if (d.grade == null || !g[d.grade]) { d.grade = -1; g.forEach((n, i) => { if (n > 0) d.grade = i; }); }
    const have = g[d.grade] || 0; d.qty = clamp(Math.round(d.qty || 1), 1, Math.max(1, have));
    let h = '<div class="sheet-head"><h2>Deposit to vault</h2><span class="small muted">Spare goods for the crew. Not paid; fill a requisition to earn coin.</span></div>' +
      '<div class="cw-strip" role="listbox" aria-label="Item">' + list.map((id) => '<button type="button" class="cw-tile' + (id === d.itemId ? ' sel' : '') + '" data-act="crew:depPick" data-id="' + esc(id) + '" aria-selected="' + (id === d.itemId) + '" title="' + esc(item(id).name) + '">' + itemImg(id, 28) + '<span class="num">' + fmt(count(id)) + '</span></button>').join('') + '</div>' +
      '<p class="small"><b>' + esc(item(d.itemId).name) + '</b></p><div class="cw-gch">' + (D.grades || []).map((gr, i) => g[i] ? '<button type="button" class="cw-gp' + (i === d.grade ? ' sel' : '') + '" data-act="crew:depGrade" data-id="' + i + '" aria-pressed="' + (i === d.grade) + '">' + gdot(i) + esc(gr.name) + ' <span class="num">' + g[i] + '</span></button>' : '').join('') + '</div>' +
      '<div class="cw-qty"><span>Quantity</span>' + stepper('dep', d.qty, 'cwDepQ') + '<button class="chip-btn" data-act="crew:depMax">Max</button></div>';
    h += sheetFoot('<button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="crew:depGo" data-autofocus>Deposit ' + d.qty + '</button>');
    showSheet(h, 'crewDep');
  }
  function takeSheet() {
    const w = ui.crewWd, v = (H.has('vault') && call('vault', S)) || { items: [] }, it = (v.items || []).find((x) => x.itemId === w.itemId);
    if (!it) { closeSheet(); return; }
    const gr = it.grades || [];
    if (w.grade == null || !gr[w.grade]) { w.grade = -1; gr.forEach((n, i) => { if (n > 0 && w.grade < 0) w.grade = i; }); }
    const have = gr[w.grade] || 0; w.qty = clamp(Math.round(w.qty || 1), 1, Math.max(1, have));
    const cw = can('withdraw'), left = capLeft(), okAmt = cw.ok && left >= w.qty;
    const why = !cw.ok ? cw.reason : left < w.qty ? 'Daily cap: ' + capTxt(left) + '.' : '';
    let h = '<div class="sheet-head"><div class="btn-row">' + itemImg(w.itemId, 40) + '<div><h2>' + esc(item(w.itemId).name) + '</h2><span class="small muted">In vault ×' + fmt(it.total) + ' · ' + (cw.ok ? 'take ' + capTxt(left) : 'withdraw locked') + '</span></div></div></div>' +
      '<div class="cw-gch">' + gr.map((n, i) => n ? '<button type="button" class="cw-gp' + (i === w.grade ? ' sel' : '') + '" data-act="crew:takeGrade" data-id="' + i + '" aria-pressed="' + (i === w.grade) + '">' + gdot(i) + esc(gname(i)) + ' <span class="num">' + n + '</span></button>' : '').join('') + '</div>' +
      '<div class="cw-qty"><span>Quantity</span>' + stepper('take', w.qty, 'cwTakeQ') + '</div>';
    if (why) h += '<p class="reason">' + esc(why) + '</p>';
    h += sheetFoot('<button class="btn" data-act="closeSheet">Cancel</button>' + (okAmt ? '<button class="btn primary" data-act="crew:takeGo" data-autofocus>Take ' + w.qty + '</button>' : '<button class="btn is-off" aria-disabled="true" data-act="crew:takeGo" data-why="' + esc(why) + '">Take ' + w.qty + '</button><button class="btn primary" data-act="crew:askGo" data-autofocus>Ask an officer</button>'));
    showSheet(h, 'crewTake');
  }
  function submitSheet() {
    const sb = ui.crewSub, r = reqs().find((x) => x.id === sb.id);
    if (!r || r.status !== 'open') { closeSheet(); return; }
    const max = Math.max(1, Math.min(r.remaining, (r.canFill && r.canFill.have) || 1)); sb.qty = clamp(Math.round(sb.qty || max), 1, max);
    let h = '<div class="sheet-head"><div class="btn-row">' + itemImg(r.itemId, 40) + '<div><h2>' + esc(item(r.itemId).name) + '</h2><span class="small muted">' + fmt(r.remaining) + ' still needed · min ' + esc(gname(r.minGrade || 0)) + ' · you have ' + fmt((r.canFill && r.canFill.have) || 0) + '</span></div></div></div>' +
      '<div class="cw-qty"><span>Submit</span>' + stepper('sub', sb.qty, 'cwSubQ') + '<button class="chip-btn" data-act="crew:subMax">Max</button></div>' +
      '<p class="hint" id="cwSubHint">Paid ' + (r.rewardPer ? '<b class="num gold-t">' + fmt(sb.qty * r.rewardPer) + 'g</b> now' : 'no coin') + ', first in best dressed. Goods go to the vault.</p>';
    h += sheetFoot('<button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="crew:subGo" data-autofocus>Submit ' + sb.qty + '</button>');
    showSheet(h, 'crewSub');
  }
  function craftables() {
    const set = new Set();
    (D.actions || []).forEach((a) => { if (a.inputs && a.outputs) Object.keys(a.outputs).forEach((id) => { if (item(id)) set.add(id); }); });
    return Array.from(set).sort((a, b) => item(a).name.localeCompare(item(b).name));
  }
  function postCost() { const p = ui.crewPost; return Math.max(0, Math.round(p.qty || 0) * Math.max(0, Math.round(p.rewardPer || 0))); }
  function postHint() {
    const free = treasury().coin, cost = postCost();
    return cost > free ? '<span class="reason">Escrow ' + fmt(cost) + 'g, but the treasury has only ' + fmt(free) + 'g.</span>' : 'Escrow <b class="num gold-t">' + fmt(cost) + 'g</b> from the treasury (' + fmt(free) + 'g free). Unpaid coin returns if cancelled.';
  }
  function postSheet() {
    const p = ui.crewPost, list = craftables();
    if (!p.itemId || !list.includes(p.itemId)) p.itemId = list.find((id) => /tonic|potion|elixir|draught/i.test(item(id).name)) || list[0];
    let h = '<div class="sheet-head"><h2>Post a requisition</h2><span class="small muted">Crewmates and you are paid coin per unit, first in best dressed.</span></div><form class="form" data-form="crewPost">' +
      '<div class="field"><label for="cwItem">Item</label><select id="cwItem" data-in="crewPostItem">' + list.map((id) => '<option value="' + esc(id) + '"' + (id === p.itemId ? ' selected' : '') + '>' + esc(item(id).name) + '</option>').join('') + '</select></div>' +
      '<div class="grid2"><div class="field"><label for="cwQty">How many</label><input id="cwQty" type="number" inputmode="numeric" min="1" value="' + p.qty + '" data-in="crewPostQty"></div>' +
      '<div class="field"><label for="cwRew">Coin each</label><input id="cwRew" type="number" inputmode="numeric" min="0" value="' + p.rewardPer + '" data-in="crewPostReward"></div></div>' +
      '<div class="field"><label for="cwMin">Minimum quality</label><select id="cwMin" data-in="crewPostGrade">' + (D.grades || []).map((g, i) => '<option value="' + i + '"' + (i === p.minGrade ? ' selected' : '') + '>' + esc(g.name) + '</option>').join('') + '</select></div>' +
      '<p class="hint" id="cwPostHint">' + postHint() + '</p>' + (ui.crewPostErr ? '<p class="reason" role="alert">' + esc(ui.crewPostErr) + '</p>' : '') + '</form>';
    h += sheetFoot('<button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" id="cwPostGo" data-act="crew:postGo"' + (postCost() > treasury().coin ? ' disabled' : '') + ' data-autofocus>Post</button>');
    showSheet(h, 'crewPost');
  }
  function refreshPost() {
    const hh = H.$('cwPostHint'); if (hh) hh.innerHTML = postHint();
    const b = H.$('cwPostGo'); if (b) b.disabled = postCost() > treasury().coin || !(ui.crewPost.qty > 0);
  }

  // ---- actions
  function toVault(spec) {
    if (!H.has('vaultDeposit')) return { ok: false, reason: 'The crew vault is not open yet.' };
    const c = can('deposit'); if (!c.ok) return { ok: false, reason: c.reason };
    return spec.kind === 'gear' ? call('vaultDeposit', S, spec) : call('vaultDeposit', S, spec);
  }
  function after() { persist(); renderView(true); H.updateLive(); }
  function onAction(a, el, ctx) {
    sync(ctx);
    if (a === 'logFilter') { ui.logFilter = el.dataset.id; renderView(true); return true; }
    if (a.indexOf('crew:') !== 0) return false;
    const k = a.slice(5), id = el.dataset.id;
    if (el.classList.contains('is-off')) { toast('<span>' + esc(el.dataset.why || 'Not available.') + '</span>', 'warn', 3200); return true; }
    switch (k) {
      case 'seg': ui.crewSeg = id; renderView(true); return true;
      case 'sched2': ui.crewSchedOpen = !ui.crewSchedOpen; renderView(true); return true;
      case 'allMem': ui.crewAllMem = !ui.crewAllMem; renderView(true); return true;
      case 'dev': ui.crewDev = !ui.crewDev; renderView(true); return true;
      case 'trInfo': ui.crewTrInfo = !ui.crewTrInfo; renderView(true); return true;
      case 'perms': ui.crewPerms = !ui.crewPerms; renderView(true); return true;
      case 'viewAs': call('setViewAsMember', S, !(crewOf().viewAsMember)); after(); return true;
      case 'feedF': ui.crewFeedF = id; renderView(true); return true;
      case 'reqMore': ui.crewReqOpen = ui.crewReqOpen === id ? null : id; renderView(true); return true;
      case 'assist': ui.crewOpen = true; go('workshop'); return true;
      case 'make': { const ac = act(id); ui.crewServe = el.dataset.req || null; if (ac) H.goSkill(ac.skill, id); return true; }
      case 'askOfficer': toast('<span>Officers can cancel or change requisitions. Ask in crew chat.</span>'); return true;
      case 'market': ui.marketSeg = 'buy'; ui.marketFind = id; ui.marketNeeded = false; closeSheet(); go('market'); renderView(true); return true;
      case 'post': { ui.crewPostErr = null;  const p = ui.crewPost || (ui.crewPost = { itemId: null, qty: 20, rewardPer: 5, minGrade: 0 }); void p; postSheet(); return true; }
      case 'postGo': {
        const p = ui.crewPost, r = call('postRequisition', S, { itemId: p.itemId, qty: Math.max(1, Math.round(p.qty)), rewardPer: Math.max(0, Math.round(p.rewardPer)), minGrade: p.minGrade });
        if (r && r.ok === false) { ui.crewPostErr = r.reason || 'Not enough free treasury coin.'; postSheet(); return true; }
        ui.crewPostErr = null;
        if (result(r, '<span>Requisition posted' + (p.rewardPer ? ' · ' + fmt(postCost()) + 'g escrowed' : '') + '</span>') && r) { closeSheet(); ui.crewSeg = 'req'; ui.crewReqOpen = r.req ? r.req.id : null; }
        after(); return true;
      }
      case 'cancelReq': { const r = call('cancelRequisition', S, id); if (result(r, '<span>Requisition cancelled' + (r && r.refunded ? ' · ' + fmt(r.refunded) + 'g back in the treasury' : '') + '</span>')) ui.crewReqOpen = null; after(); return true; }
      case 'submit': { ui.crewSub = { id, qty: null }; submitSheet(); return true; }
      case 'subMax': ui.crewSub.qty = 1e9; submitSheet(); return true;
      case 'subGo': {
        const sb = ui.crewSub, r = call('fillRequisition', S, sb.id, sb.qty);
        if (result(r)) { closeSheet(); toast('<span>' + (r.accepted || 0) + ' accepted' + (r.paid ? ' · paid <b>' + fmt(r.paid) + 'g</b>' : ' · not paid (already filled)') + '</span>'); H.tossItems && r.paid && H.tossItems([{ url: miniURL('coin') }]); }
        after(); return true;
      }
      case 'dep': ui.crewDep = ui.crewDep || { itemId: null, grade: null, qty: 1 }; depSheet(); return true;
      case 'depItem': ui.crewDep = { itemId: id, grade: null, qty: 1 }; depSheet(); return true;
      case 'depPick': ui.crewDep = { itemId: id, grade: null, qty: 1 }; depSheet(); return true;
      case 'depGrade': ui.crewDep.grade = Number(id); depSheet(); return true;
      case 'depMax': ui.crewDep.qty = 1e9; depSheet(); return true;
      case 'depGo': {
        const d = ui.crewDep, r = toVault({ kind: 'item', itemId: d.itemId, grade: d.grade, qty: d.qty });
        if (result(r, '<span>Deposited ' + d.qty + ' ' + esc(item(d.itemId).name) + '</span>')) { closeSheet(); H.bump && H.bump('kit', 0); }
        after(); return true;
      }
      case 'take': ui.crewWd = { itemId: id, grade: null, qty: 1 }; takeSheet(); return true;
      case 'takeGrade': ui.crewWd.grade = Number(id); takeSheet(); return true;
      case 'takeGo': {
        const w = ui.crewWd, r = call('vaultWithdraw', S, w.itemId, w.grade, w.qty);
        if (result(r, '<span>Took ' + w.qty + ' ' + esc(item(w.itemId).name) + ' from the vault</span>')) { closeSheet(); H.bump && H.bump('kit', w.qty); }
        after(); return true;
      }
      case 'askGo': {
        const w = ui.crewWd, r = call('requestWithdrawal', S, { itemId: w.itemId, grade: w.grade, qty: w.qty });
        if (result(r, '<span>Request sent. An officer will answer soon.</span>')) closeSheet();
        after(); return true;
      }
      case 'takeGear': {
        if (can('withdraw').ok) result(call('vaultWithdrawGear', S, id), '<span>Took it from the vault</span>');
        else result(call('requestWithdrawal', S, { uid: id }), '<span>Request sent. An officer will answer soon.</span>');
        after(); return true;
      }
      case 'answer': result(call('resolveWithdrawal', S, id, el.dataset.yes === '1'), '<span>Answered</span>'); after(); return true;
      case 'sched': { const d = ui.crewSched; result(call('setRaidSchedule', S, { startDay: d.day, startHour: d.hour }), '<span>Raid window saved</span>'); after(); return true; }
      case 'step': {
        const kk = el.dataset.k, d = Number(el.dataset.d);
        if (kk === 'dep') { ui.crewDep.qty = Math.max(1, (ui.crewDep.qty || 1) + d); depSheet(); }
        else if (kk === 'take') { ui.crewWd.qty = Math.max(1, (ui.crewWd.qty || 1) + d); takeSheet(); }
        else if (kk === 'sub') { ui.crewSub.qty = Math.max(1, (ui.crewSub.qty || 1) + d); submitSheet(); }
        return true;
      }
      default: return false;
    }
  }
  function onInput(key, el, e, ctx) {
    sync(ctx);
    const p = ui.crewPost;
    switch (key) {
      case 'crewRank': { const r = call('setMemberRank', S, el.dataset.id, el.value); result(r, '<span>Role updated</span>'); after(); return true; }
      case 'crewSchedDay': ui.crewSched.day = Number(el.value); return true;
      case 'crewSchedHour': ui.crewSched.hour = Number(el.value); return true;
      case 'crewPostItem': p.itemId = el.value; return true;
      case 'crewPostQty': p.qty = Math.max(0, Math.round(Number(el.value) || 0)); refreshPost(); return true;
      case 'crewPostReward': p.rewardPer = Math.max(0, Math.round(Number(el.value) || 0)); refreshPost(); return true;
      case 'crewPostGrade': p.minGrade = Number(el.value); return true;
      default: return false;
    }
  }
  function onSubmit(form, e, ctx) {
    sync(ctx);
    if (form.dataset.form !== 'crewPost') return false;
    e.preventDefault(); return true;
  }

  // ---- badge: open requisitions you can fill right now (cached, called every tick)
  let bCache = { t: 0, n: 0 };
  function badge(ctx) {
    sync(ctx);
    const now = Date.now();
    if (now - bCache.t < 1000) return bCache.n;
    bCache = { t: now, n: 0 };
    try { if (ready()) bCache.n = reqs().filter((r) => r.status === 'open' && r.canFill && r.canFill.ok).length; } catch (err) { bCache.n = 0; }
    return bCache.n;
  }
  let sig = '';
  function live(ctx) {
    sync(ctx);
    const c = S.crew || {}, f = c.feed || [];
    const s = f.length + ':' + (f[0] ? f[0].t : 0) + ':' + (c.requisitions || []).length + ':' + ((c.requisitions || []).reduce((n, r) => n + (r.filled || 0), 0)) + ':' + ((c.withdrawRequests || []).map((r) => r.status).join(''));
    if (s !== sig) { const first = sig === ''; sig = s; if (!first) markDirty(); }
  }
  function mount(ctx) {
    sync(ctx);
    if (ui.crewSeg === 'req' && H.has('markRequisitionsSeen')) call('markRequisitionsSeen', S);
  }
  function sendToVault(spec, ctx) { sync(ctx); return toVault(spec); }

  G.UI.screens.crew = { render, badge, onAction, onInput, onSubmit, live, mount, sendToVault };
})();
</script>
<script>
/* ==== ui/kit.js ==== */
/* Guildwright screen module: kit. See UI_CONTRACT.md. */
(function () {
  'use strict';
  const G = window.GW, H = G.UI.h, ui = H.ui;
  const { esc, call, fmt, cap, clamp, act, item, rIdx, rId, rName, gName, count, gearByUid, isEquipped, SLOTS, itemURL, itemImg, gdot, toast, renderView, tossItems, tossOf, persist, result, statLine, gradeOfQ, upgradeInfo, bestUpgrades, updateLive, queueReveal, go, openSheet, closeSheet, sheetFoot, markDirty } = H;
  let S, D, E; // refreshed from ctx on every entry point
  const sync = (c) => { S = c.S; D = c.D; E = c.E || G.Engine; return c; };
  const has = (n) => typeof (E || G.Engine)[n] === 'function';
  const SLOT_NAME = { weapon: 'Weapon', offhand: 'Offhand', head: 'Head', chest: 'Chest', legs: 'Legs', ring: 'Ring' };
  const tags = () => (D && D.statTags) || [];
  const tagDef = (id) => tags().find((t) => t.id === id) || { id, name: cap(id || ''), unit: 'pts' };
  const fmtTag = (id, v) => { const t = tagDef(id); return t.unit === 'pct' ? (Math.round(v * 1000) / 10) + '%' : String(Math.round(v)); };
  const locked = () => !!(S.raid && S.raid.lock);
  const roles = () => ((D && D.raidRoles) || []).filter((r) => r.check);
  const loadoutsOf = () => (has('loadouts') ? call('loadouts', S) : null) || [];
  const gearTags = (g) => (has('gearTags') ? call('gearTags', g) : null) || {};
  const tagVal = (g, t) => (has('tagValue') ? call('tagValue', g, t) : (gearTags(g)[t] || 0)) || 0;
  function equippedTags() {
    const out = {};
    SLOTS.forEach((sl) => { const g = gearByUid((S.equipped || {})[sl]); if (g) Object.entries(gearTags(g)).forEach(([k, v]) => { out[k] = (out[k] || 0) + v; }); });
    return out;
  }
  const dl = (d) => '<span class="dl ' + (d.delta > 0 ? 'up' : d.delta < 0 ? 'dn' : '') + '">' + esc(d.text || (d.label + ' ' + (d.delta > 0 ? '+' : '') + fmtTag(d.tag, d.delta))) + '</span>';
  const tagChips = (sel, act, extra) => '<div class="ktags">' + ['<button class="fchip" data-act="' + act + '" data-tag="" aria-pressed="' + (!sel) + '">' + (extra || 'All') + '</button>']
    .concat(tags().map((t) => '<button class="fchip" data-act="' + act + '" data-tag="' + esc(t.id) + '" aria-pressed="' + (sel === t.id) + '">' + esc(t.name) + '</button>')).join('') + '</div>';
  const doneMut = (r, ok) => { const good = result(r, ok); persist(); renderView(true); H.updateLive(); return good; };

  // ---- Character
  function vChar() {
    const ps = call('playerStats', S) || {};
    let h = '<div class="stats">' + [['ATK', ps.atk], ['DEF', ps.def], ['HEAL', ps.heal], ['MAX HP', ps.maxHp], ['POWER', ps.power]].map(([k, v], i) =>
      '<div class="' + (i === 4 ? 'pw' : '') + '"><b class="num">' + fmt(v || 0) + '</b><span class="eyebrow">' + k + '</span></div>').join('') + '</div>';
    const et = Object.entries(equippedTags()).filter(([, v]) => v).sort((a, b) => (tagDef(a[0]).kind === 'skill') - (tagDef(b[0]).kind === 'skill'));
    const el = ps.elements ? Object.entries(ps.elements).filter(([, v]) => v) : [];
    if (et.length || el.length) h += '<div class="btn-row ktagrow">' + et.map(([k, v]) => '<span class="chip ' + (tagDef(k).kind === 'skill' ? 'accent' : '') + '">' + esc(tagDef(k).name) + ' +' + fmtTag(k, v) + '</span>').join('') +
      el.map(([k, v]) => '<span class="chip">' + esc(k) + ' +' + Math.round(v) + '</span>').join('') + '</div>';
    const ups = bestUpgrades();
    h += '<section class="sec"><div class="sec-head"><h2>Equipped</h2>' + (ups.length ? '<button class="btn small primary" data-act="equipBest"' + (locked() ? ' disabled title="Locked for the raid"' : '') + '>Equip best · ' + ups.length + '</button>' : '') + '</div><div class="slots">';
    SLOTS.forEach((slot) => {
      const g = gearByUid((S.equipped || {})[slot]);
      if (!g) { h += '<button class="slot empty-slot" data-act="kit:slot" data-target="eq" data-slot="' + esc(slot) + '"' + (locked() ? ' disabled title="Locked for the raid"' : '') + '><span class="ph">' + esc(SLOT_NAME[slot] || slot) + '</span><span class="sn faint">Empty</span></button>'; return; }
      const broken = g.dur <= 0;
      h += '<button class="slot r-' + rId(g.rarity) + (broken ? ' broken' : '') + '" data-act="kit:slot" data-target="eq" data-slot="' + esc(slot) + '"' + (locked() ? ' disabled title="Locked for the raid"' : '') + '>' + itemImg(g.itemId, 36) +
        '<span class="sn">' + esc(item(g.itemId).name) + '</span><span class="meter thin' + (g.dur / g.maxDur < 0.25 ? ' hp' : ' brass') + '"><i style="--p:' + clamp(g.dur / (g.maxDur || 1), 0, 1).toFixed(3) + '"></i></span></button>';
    });
    return h + '</div></section>';
  }

  // ---- Loadouts
  function roleChip(rc, r) {
    if (!rc) return '';
    return '<span class="chip ' + (rc.ok ? 'good' : 'lock') + '" title="' + esc(rc.reason || rc.label || '') + '">' + (rc.ok ? '✓ ' : '✕ ') + esc(r.name) + '</span>';
  }
  function miniSlots(lv) {
    return '<span class="mini">' + SLOTS.map((sl) => {
      const uid = (lv.slots || {})[sl], g = uid && gearByUid(uid);
      if (g) return '<i class="r-' + rId(g.rarity) + '">' + itemImg(g.itemId, 22) + '</i>';
      return '<i class="' + (uid ? 'gone' : 'none') + '"></i>';
    }).join('') + '</span>';
  }
  function wornNow(lv) { const eq = S.equipped || {}; return SLOTS.every((sl) => !(lv.slots || {})[sl] || (lv.slots || {})[sl] === eq[sl]) && SLOTS.some((sl) => (lv.slots || {})[sl]); }
  function vLoadouts() {
    if (!has('loadouts')) return '<div class="empty">Loadouts arrive with the next engine update.</div>';
    const ro = locked(), list = loadoutsOf();
    let h = '';
    if (ro) h += '<div class="knote"><span><b>Raid lock is on.</b> Loadouts are read-only until the raid ends.</span> <button class="btn tiny" data-act="kit:raidgo">Lock-in</button></div>';
    h += '<section class="sec"><div class="sec-head"><h2>Loadouts</h2><button class="btn small primary" data-act="kit:new"' + (ro ? ' disabled' : '') + '>+ New</button></div>';
    if (!list.length) {
      h += '<div class="empty">Save a set, bind it to an activity, check it against raid roles.' + (ro ? '' : '<div class="filters kpre">' + ['Gathering', 'Crafting', 'Raid'].map((n) => '<button class="fchip" data-act="kit:new" data-name="' + n + '">' + n + '</button>').join('') + '</div>') + '</div>';
    } else h += '<div class="gearlist">' + list.map((lv) => loadoutCard(lv, ro)).join('') + '</div>';
    return h + '</section>';
  }
  function skillName(id) { const sk = (D.skills || []).find((x) => x.id === id); return sk ? sk.name : id; }
  function loadoutCard(lv, ro) {
    const open = ui.kitOpen === lv.id, worn = wornNow(lv), inc = lv.complete === false || (lv.missing || []).length;
    const rl = roles();
    let h = '<article class="gear lo' + (inc ? ' incomplete' : '') + (worn ? ' equipped' : '') + '" id="lo-' + esc(lv.id) + '">';
    h += '<button class="lo-top" data-act="kit:open" data-id="' + esc(lv.id) + '" aria-expanded="' + open + '"><span class="ln">' + esc(lv.name) + '</span>' + miniSlots(lv) +
      '<span class="lc">' + (inc ? '<span class="chip lock">Incomplete</span>' : '') + (worn ? '<span class="chip good">Worn</span>' : '') + (lv.isRaid ? '<span class="chip accent">Raid set</span>' : '') +
      (lv.boundTo ? '<span class="chip accent">⚑ ' + esc(skillName(lv.boundTo)) + '</span>' : '') + (lv.goal ? '<span class="chip">' + esc(tagDef(lv.goal).name) + '</span>' : '') +
      rl.map((r) => roleChip((lv.roleChecks || {})[r.id], r)).join('') + '</span></button>';
    if (open) {
      h += '<div class="gear-body">';
      if (ro) h += '<p class="reason">Locked for the raid: editing and equipping are off until it ends.</p>';
      if (inc) h += '<p class="reason">Missing: ' + (lv.missing || []).map((s) => esc(SLOT_NAME[s] || s)).join(', ') + '. Sold, salvaged or sent to the vault. Pick replacements below.</p>';
      h += '<div class="field"><label>Name</label><input data-in="kit:name" data-id="' + esc(lv.id) + '" value="' + esc(lv.name) + '" maxlength="24"' + (ro ? ' disabled' : '') + '></div>';
      h += '<div class="slots lslots">' + SLOTS.map((sl) => {
        const uid = (lv.slots || {})[sl], g = uid && gearByUid(uid);
        return '<button class="slot ' + (g ? 'r-' + rId(g.rarity) : 'empty-slot') + (uid && !g ? ' gone' : '') + '" data-act="kit:slot" data-target="' + esc(lv.id) + '" data-slot="' + esc(sl) + '"' + (ro ? ' disabled' : '') + '>' +
          (g ? itemImg(g.itemId, 32) + '<span class="sn">' + esc(item(g.itemId).name) + '</span>' : '<span class="ph">' + esc(SLOT_NAME[sl]) + '</span><span class="sn ' + (uid ? 'bad' : 'faint') + '">' + (uid ? 'Gone' : 'Empty') + '</span>') + '</button>';
      }).join('') + '</div>';
      h += '<div class="field"><label>Goal</label>' + tagChips(lv.goal, 'kit:goal', 'None').replace(/data-act="kit:goal"/g, 'data-act="kit:goal" data-id="' + esc(lv.id) + '"') + '</div>';
      h += '<div class="btn-row"><button class="btn small primary" data-act="kit:build" data-id="' + esc(lv.id) + '"' + (ro || !lv.goal ? ' disabled' : '') + '>Auto-build' + (lv.goal ? ' · ' + esc(tagDef(lv.goal).name) : '') + '</button>' +
        (!lv.goal ? '<span class="hint">Pick a goal first.</span>' : '') + '</div>';
      h += '<div class="field"><label>Bind to activity</label><select data-in="kit:bind" data-id="' + esc(lv.id) + '"' + (ro ? ' disabled' : '') + '><option value="">Not bound</option>' +
        (D.skills || []).map((sk) => '<option value="' + esc(sk.id) + '"' + (lv.boundTo === sk.id ? ' selected' : '') + '>' + esc(sk.name) + '</option>').join('') + '</select></div>';
      if (lv.boundTo) h += '<p class="hint">Starting any ' + esc(skillName(lv.boundTo)) + ' activity equips this set first.</p>';
      h += '<div class="rows krole">' + rl.map((r) => {
        const rc = (lv.roleChecks || {})[r.id]; if (!rc) return '';
        const need = rc.need || 0, pw = rc.power || 0;
        return '<div class="rowi"><span></span><span class="rn">' + esc(r.name) + ' <span class="chip ' + (rc.ok ? 'good' : 'lock') + '">' + (rc.ok ? 'Pass' : 'Fail') + '</span></span><span class="rp"><b class="num">' + fmt(pw) + '/' + fmt(need) + '</b><small>' + esc(r.powerLabel || r.stat || '') + '</small></span></div>';
      }).join('') + '</div>';
      h += '<div class="btn-row">';
      if (ui.confirm === 'kitdel:' + lv.id) h += '<span class="small">Delete? Gear stays in your bag.</span><button class="btn small danger solid" data-act="kit:del" data-id="' + esc(lv.id) + '">Delete</button><button class="btn small ghost" data-act="cancelConfirm">Keep</button>';
      else h += '<button class="btn small primary" data-act="kit:equip" data-id="' + esc(lv.id) + '"' + (ro ? ' disabled title="Locked for the raid"' : '') + '>Equip</button>' +
        '<button class="btn small" data-act="kit:raidset" data-id="' + esc(lv.id) + '"' + (ro ? ' disabled' : '') + '>' + (lv.isRaid ? 'Raid set ✓' : 'Use for raid') + '</button>' +
        '<button class="btn small ghost" data-act="kit:raidgo">Raid lock-in →</button><button class="btn small ghost danger" data-act="kit:askdel" data-id="' + esc(lv.id) + '"' + (ro ? ' disabled' : '') + '>Delete</button>';
      h += '</div></div>';
    }
    return h + '</article>';
  }

  // ---- Gear picker sheet (equipped slot or a loadout slot): filter by tag, sort by contribution, deltas vs current
  function openPicker(target, slot) {
    ui.kitPick = { target, slot };
    const lv = target === 'eq' ? null : loadoutsOf().find((x) => x.id === target);
    const curUid = target === 'eq' ? (S.equipped || {})[slot] : lv && (lv.slots || {})[slot];
    const tag = ui.kitTag || '';
    let cands = (S.gear || []).filter((g) => item(g.itemId).slot === slot);
    const present = new Set(); cands.forEach((g) => Object.entries(gearTags(g)).forEach(([k, v]) => { if (v) present.add(k); }));
    if (tag) cands = cands.filter((g) => tagVal(g, tag) > 0 || g.uid === curUid);
    cands.sort((a, b) => (tag ? tagVal(b, tag) - tagVal(a, tag) : 0) || ((call('gearScore', b) || H.gearScore(b) || 0) - (call('gearScore', a) || H.gearScore(a) || 0)));
    let h = '<div class="sheet-head"><h2>' + esc(SLOT_NAME[slot] || slot) + (lv ? ' · ' + esc(lv.name) : '') + '</h2><span class="eyebrow">' + cands.length + ' in bag' + (tag ? ' · sorted by ' + esc(tagDef(tag).name) : '') + '</span></div>';
    h += '<div class="ktags">' + ['<button class="fchip" data-act="kit:ptag" data-tag="" aria-pressed="' + (!tag) + '">All</button>'].concat(tags().filter((t) => present.has(t.id) || t.id === tag).map((t) => '<button class="fchip" data-act="kit:ptag" data-tag="' + esc(t.id) + '" aria-pressed="' + (tag === t.id) + '">' + esc(t.name) + '</button>')).join('') + '</div>';
    h += '<div class="gearlist kpick">';
    if (!cands.length) h += '<div class="empty">Nothing in your bag fits ' + (tag ? 'this tag' : 'this slot') + '.</div>';
    cands.forEach((g) => {
      const here = g.uid === curUid, broken = g.dur <= 0;
      let deltas = [];
      if (!here) {
        if (target === 'eq' && has('compareGear')) deltas = ((call('compareGear', S, g.uid) || {}).deltas) || [];
        else if (lv && has('compareLoadout')) deltas = ((call('compareLoadout', S, Object.assign({}, lv.slots, { [slot]: g.uid }), lv.slots) || {}).deltas) || [];
      }
      deltas = deltas.filter((d) => d.delta);
      h += '<article class="gear r-' + rId(g.rarity) + (here ? ' equipped' : '') + '"><div class="pk"><span class="pi">' + itemImg(g.itemId, 36) + '</span><span class="pn"><b class="rink">' + esc(call('gearName', g) || item(g.itemId).name) + '</b><br><span class="small muted">' +
        (tag ? esc(tagDef(tag).name) + ' ' + fmtTag(tag, tagVal(g, tag)) + ' · ' : '') + esc(statLine(call('gearStats', g) || {})) + ' · ' + Math.ceil(g.dur) + '/' + Math.round(g.maxDur) + '</span></span>' +
        (here ? '<span class="chip good">In slot</span>' : '<button class="btn small primary" data-act="kit:pick" data-uid="' + esc(g.uid) + '"' + (broken ? ' disabled' : '') + '>' + (target === 'eq' ? 'Equip' : 'Use') + '</button>') + '</div>' +
        (deltas.length ? '<div class="deltas">' + deltas.map(dl).join('') + '</div>' : (!here ? '<div class="deltas"><span class="dl">no change vs. ' + (curUid ? 'current' : 'empty') + '</span></div>' : '')) + '</article>';
    });
    h += '</div>';
    h += sheetFoot((curUid ? '<button class="btn" data-act="kit:clear">' + (target === 'eq' ? 'Unequip' : 'Empty slot') + '</button>' : '') + '<button class="btn ghost" data-act="closeSheet">Close</button>');
    openSheet(h, 'kitpick');
  }

  // ---- Bag
  function vBagBody() {
    const ps = call('playerStats', S) || {};
    const cat = ui.kitCat || 'all';
    let h = '<div class="filters kcats">' + [['all', 'All'], ['gear', 'Gear'], ['mats', 'Materials'], ['prov', 'Provisions']].map(([k, n]) => '<button class="fchip" data-act="kit:cat" data-id="' + k + '" aria-pressed="' + (cat === k) + '">' + n + '</button>').join('') + '</div>';
    // materials
    let mark = h.length;
    const mats = Object.keys(S.inv || {}).filter((id) => count(id) > 0 && !['food', 'potion'].includes(item(id).kind))
      .sort((a, b) => (item(a).tier - item(b).tier) || item(a).name.localeCompare(item(b).name));
    h += '<section class="sec"><div class="sec-head"><h2>Materials</h2><span class="eyebrow">' + mats.length + ' kinds</span></div>';
    if (!mats.length) h += '<div class="empty">Nothing yet. Start a gathering job in the Workshop; materials land here with a quality grade.</div>';
    else h += '<div class="mats">' + mats.map((id) => {
      const g = S.inv[id] || []; let best = -1; g.forEach((n, i) => { if (n) best = i; });
      return '<button class="mat" data-act="openItem" data-id="' + id + '">' + (best >= 0 ? '<i class="gdot g' + best + '" title="Best: ' + esc(gName(best)) + '"></i>' : '') + itemImg(id, 32) +
        '<span class="ct num">' + fmt(count(id)) + '</span><span class="mn">' + esc(item(id).name) + '</span></button>';
    }).join('') + '</div>';
    h += '</section>';
    if (cat !== 'all' && cat !== 'mats') h = h.slice(0, mark);
    // provisions
    mark = h.length;
    const prov = Object.keys(S.inv || {}).filter((id) => ['food', 'potion'].includes(item(id).kind) && count(id) > 0);
    const full = (S.hp || 0) >= (ps.maxHp || 0) - 0.5;
    if (prov.length) {
      h += '<section class="sec"><div class="sec-head"><h2>Provisions</h2><span class="eyebrow num">HP ' + Math.ceil(S.hp || 0) + '/' + Math.round(ps.maxHp || 0) + '</span></div><div class="provisions">' + prov.map((id) => {
        const it = item(id);
        const desc = [it.heal ? 'Heals ' + it.heal : '', it.buff ? '+' + Math.round(it.buff.pct * 100) + '% ' + it.buff.stat + ' in raids' : ''].filter(Boolean).join(' · ');
        return '<div class="prov">' + itemImg(id, 28) + '<span><b>' + esc(it.name) + '</b> <span class="num muted">×' + fmt(count(id)) + '</span><br><span class="small muted">' + esc(desc || cap(it.kind)) + '</span></span>' +
          (it.heal ? '<button class="btn small" data-act="eat" data-id="' + id + '"' + (full ? ' disabled title="Already at full HP"' : '') + '>Eat</button>' : '<span class="chip">Raid</span>') + '</div>';
      }).join('') + '</div></section>';
    }
    if (cat !== 'all' && cat !== 'prov') h = h.slice(0, mark);
    mark = h.length;
    // gear (identical plain Commons grouped)
    const all = (S.gear || []).slice();
    const gtag = ui.kitBagTag || '';
    const groups = {}, singles = [];
    all.forEach((g) => {
      if (gtag) { if (tagVal(g, gtag) > 0) singles.push(g); return; }
      if (!isEquipped(g.uid) && rIdx(g.rarity) === 0 && !(g.affixes || []).length && g.dur >= g.maxDur) (groups[g.itemId] = groups[g.itemId] || []).push(g);
      else singles.push(g);
    });
    Object.keys(groups).forEach((k) => { if (groups[k].length < 2) { singles.push(groups[k][0]); delete groups[k]; } });
    if (gtag) singles.sort((a, b) => tagVal(b, gtag) - tagVal(a, gtag));
    else singles.sort((a, b) => (isEquipped(b.uid) - isEquipped(a.uid)) || ((upgradeInfo(b) ? 1 : 0) - (upgradeInfo(a) ? 1 : 0)) || (rIdx(b.rarity) - rIdx(a.rarity)) || ((call('gearValue', b) || 0) - (call('gearValue', a) || 0)));
    const fuseable = new Set((call('fuseCandidates', S) || []).map((c) => c.itemId));
    h += '<section class="sec"><div class="sec-head"><h2>Gear</h2><span class="eyebrow">' + (gtag ? singles.length + ' of ' : '') + all.length + ' pieces</span></div>';
    if (has('gearTags') && tags().length) h += tagChips(gtag, 'kit:btag');
    if (!all.length) h += '<div class="empty">No gear. Craft some in Smithing, Woodworking, Leatherworking or Tailoring.</div>';
    else {
      h += '<div class="gearlist">' + singles.map(gearRow).join('');

          '<span class="gn">' + esc(item(id).name) + ' <span class="num muted">×' + list.length + '</span></span><span class="gs"><span class="rink">Common</span><span>' + esc(statLine(call('gearStats', list[0]) || {})) + '</span></span></button>' +
          (fuseable.has(id) && list.length >= 5 ? '<button class="btn small" data-act="fuse" data-id="' + esc(id) + '">Fuse 5 →</button>' : '') + '</div>';

  }
  function vBag() {
    const seg = '<div class="seg kseg" role="group">' + [['sets', 'Loadouts'], ['bag', 'Bag']].map(([k, n]) => '<button data-act="kit:view" data-id="' + k + '" aria-pressed="' + ((ui.kitView || 'sets') === k) + '">' + n + '</button>').join('') + '</div>';

  }
  function gearRow(g) {
    const it = item(g.itemId), eq = isEquipped(g.uid), open = ui.gearOpen === g.uid;
    const st = call('gearStats', g) || {};
    const broken = g.dur <= 0, worn = g.dur < g.maxDur;
    const up = upgradeInfo(g);
    let h = '<article class="gear r-' + rId(g.rarity) + (eq ? ' equipped' : '') + '" id="gear-' + esc(g.uid) + '">';

      '<span class="gs"><span class="rink">' + esc(rName(g.rarity)) + '</span>' + (broken ? '<span class="bad">Broken</span>' : '<span>' + esc(statLine(st)) + '</span>') + (ui.kitBagTag ? '<span class="chip accent">' + esc(tagDef(ui.kitBagTag).name) + ' +' + fmtTag(ui.kitBagTag, tagVal(g, ui.kitBagTag)) + '</span>' : '') + '</span></button>';
    if (!eq && has('compareGear')) { const ds = (((call('compareGear', S, g.uid) || {}).deltas) || []).filter((d) => d.delta); if (ds.length) h += '<div class="deltas">' + ds.map(dl).join('') + '</div>'; }
    if (open) {
      h += '<div class="gear-body">';
      const name = call('gearName', g) || '';
      if ((g.affixes || []).length) h += '<div class="affixes">' + g.affixes.map((af) => { const d = (D.affixes || []).find((x) => x.id === af.id) || { name: af.id, stat: '' }; return '<span class="chip">' + esc(d.name) + ' +' + af.value + (d.stat === 'dur' || d.stat === 'speed' ? '%' : '') + ' ' + esc(d.stat) + '</span>'; }).join('') + '</div>';
      h += '<p class="small muted">' + esc(cap(it.slot)) + ' · quality ' + Math.round(g.quality || 0) + ' ' + esc(gName(gradeOfQ(g.quality))) + ' · suits ' + esc(it.role || '–') + ' · ~' + fmt(call('gearValue', g) || 0) + 'g · ' + Math.ceil(g.dur) + '/' + Math.round(g.maxDur) + ' durability</p>';
      const rc = call('repairCost', S, g.uid) || {};
      if (ui.confirm === 'salvage:' + g.uid) {
        h += '<div class="confirm"><p>Salvage for about 30% of its materials? It is gone for good.</p><button class="btn small danger solid" data-act="salvage" data-id="' + esc(g.uid) + '">Salvage</button><button class="btn small ghost" data-act="cancelConfirm">Keep it</button></div>';
      } else {
        const canRepair = worn && g.dur < (rc.newMaxDur || g.maxDur) && (rc.gold || 0) <= S.gold;
        h += '<div class="btn-row">' + (eq ? '<button class="btn small" data-act="unequip" data-id="' + esc(it.slot) + '">Unequip</button>' : '<button class="btn small primary" data-act="equip" data-id="' + esc(g.uid) + '">Equip</button>');
        if (worn) h += '<button class="btn small" data-act="repair" data-id="' + esc(g.uid) + '"' + (canRepair ? '' : ' disabled') + '>Repair <span class="sub">' + fmt(rc.gold || 0) + 'g · max → ' + Math.round(rc.newMaxDur || g.maxDur) + '</span></button>';
        h += '<button class="btn small ghost" data-act="openGearSheet" data-id="' + esc(g.uid) + '">Vault…</button>';
        if (!eq) h += '<button class="btn small ghost" data-act="askSalvage" data-id="' + esc(g.uid) + '">Salvage</button>';
        h += '</div>';
        if (worn && !canRepair && g.dur >= (rc.newMaxDur || 0)) h += '<p class="hint">Repair once it drops below ' + Math.round(rc.newMaxDur) + ', or it would only lower the maximum.</p>';

  }

  function onAction(a, el, ctx) {
    sync(ctx);
    const id = el.dataset.id;
    const refreshPick = () => { if (ui.kitPick) openPicker(ui.kitPick.target, ui.kitPick.slot); };
    const lvOf = (i) => loadoutsOf().find((x) => x.id === i);
    const save = (lv, patch) => call('saveLoadout', S, Object.assign({ id: lv.id, name: lv.name, slots: Object.assign({}, lv.slots), goal: lv.goal }, patch));
    switch (a) {
      case 'kit:view': ui.kitView = id; renderView(true); return true;
      case 'kit:cat': ui.kitCat = id; renderView(true); return true;
      case 'kit:btag': ui.kitBagTag = el.dataset.tag || ''; renderView(true); return true;
      case 'kit:ptag': ui.kitTag = el.dataset.tag || ''; refreshPick(); return true;
      case 'kit:open': ui.kitOpen = ui.kitOpen === id ? null : id; ui.confirm = null; renderView(true); return true;
      case 'kit:raidgo': closeSheet(); ui.raidPage = 'prep'; go('raid'); return true;
      case 'kit:new': {
        if (locked()) return true;

        if (result(r) && r.loadout) { ui.kitOpen = r.loadout.id; ui.kitView = 'sets'; }
        persist(); renderView(true);
        if (r && r.loadout) { const c = H.$('lo-' + r.loadout.id); if (c) { c.scrollIntoView({ block: 'start', behavior: H.reduceMotion ? 'auto' : 'smooth' }); const inp = c.querySelector('input'); if (inp) { inp.focus({ preventScroll: true }); inp.select(); } } }
        return true;
      }
      case 'kit:askdel': ui.confirm = 'kitdel:' + id; renderView(true); return true;
      case 'kit:del': ui.confirm = null; if (ui.kitOpen === id) ui.kitOpen = null; doneMut(call('deleteLoadout', S, id)); return true;
      case 'kit:equip': { if (locked()) return true; const r = call('equipLoadout', S, id); if (result(r) && r.missing && r.missing.length) toast('<span>Equipped ' + r.equipped + '; ' + r.missing.length + ' missing</span>'); persist(); renderView(true); H.updateLive(); return true; }
      case 'kit:raidset': { const lv = lvOf(id); const r = call('setRaidPlan', S, { loadoutId: lv && lv.isRaid ? null : id }); doneMut(r); return true; }
      case 'kit:goal': { const lv = lvOf(id); if (lv && !locked()) doneMut(save(lv, { goal: el.dataset.tag || null })); return true; }
      case 'kit:build': {
        const lv = lvOf(id); if (!lv || !lv.goal || locked()) return true;
        const b = call('autoBuild', S, lv.goal);
        if (b && b.ok !== false && b.slots) { const r = save(lv, { slots: b.slots }); if (result(r)) toast('<span>Built for ' + esc(tagDef(lv.goal).name) + '. Tap a slot to tweak.</span>'); persist(); renderView(true); }
        else result(b || { ok: false, reason: 'Nothing in the bag fits.' });
        return true;
      }
      case 'kit:slot': ui.kitTag = ui.kitTag || ''; if (locked()) return true; openPicker(el.dataset.target, el.dataset.slot); return true;
      case 'kit:pick': case 'kit:clear': {
        const pk = ui.kitPick; if (!pk) return true;
        const uid = a === 'kit:pick' ? el.dataset.uid : null;
        if (pk.target === 'eq') { const r = uid ? call('equip', S, uid) : call('unequip', S, pk.slot); closeSheet(); ui.kitPick = null; doneMut(r); return true; }
        const lv = lvOf(pk.target); if (!lv) return true;
        const sl = Object.assign({}, lv.slots, { [pk.slot]: uid });
        closeSheet(); ui.kitPick = null; doneMut(save(lv, { slots: sl })); return true;
      }
      case 'openGear': go('kit', { keepScroll: true }); ui.gearOpen = id; renderView(true); { const g = H.$('gear-' + id); if (g) g.scrollIntoView({ block: 'center', behavior: H.reduceMotion ? 'auto' : 'smooth' }); } return true;
      case 'toggleGear': ui.gearOpen = ui.gearOpen === id ? null : id; ui.confirm = null; renderView(true); return true;
      case 'equipBest': { if (locked()) return true; const ups = bestUpgrades(); ups.forEach((g) => call('equip', S, g.uid)); toast('<span>Equipped ' + ups.length + ' upgrade' + (ups.length === 1 ? '' : 's') + '</span>'); persist(); renderView(true); updateLive(); return true; }
      case 'repair': { if (result(call('repair', S, id))) persist(); renderView(true); return true; }
      case 'askSalvage': ui.confirm = 'salvage:' + id; renderView(true); return true;
      case 'salvage': {
        const r = call('salvage', S, id); ui.confirm = null; ui.gearOpen = null;
        if (result(r)) { tossItems(tossOf(r.items)); toast('<span>Salvaged: ' + ((r.items || []).map((x) => x.qty + ' ' + esc(item(x.itemId).name)).join(', ') || 'nothing usable') + '</span>'); }
        persist(); renderView(true); return true;
      }
      case 'fuse': {
        const r = call('fuse', S, id);
        if (result(r) && r.gear) { tossItems([{ url: itemURL(r.gear.itemId), rarity: r.gear.rarity }]); if (rIdx(r.gear.rarity) >= 2) queueReveal({ gear: r.gear, rarity: r.gear.rarity }); else toast(itemImg(r.gear.itemId, 22) + '<span>Fused into <b class="rink">' + esc(rName(r.gear.rarity)) + '</b></span>', 'r r-' + rId(r.gear.rarity)); }
        ui.gearOpen = null; persist(); renderView(true); return true;
      }
      default: return false;
    }
  }
  function onInput(key, el, evt, ctx) {
    sync(ctx);
    if (evt && evt.type !== 'change') return key === 'kit:name' || key === 'kit:bind';
    if (key === 'kit:name') {
      const lv = loadoutsOf().find((x) => x.id === el.dataset.id); const nm = el.value.trim().slice(0, 24);
      if (lv && nm && nm !== lv.name && !locked()) { call('saveLoadout', S, { id: lv.id, name: nm, slots: Object.assign({}, lv.slots), goal: lv.goal }); persist(); renderView(true); }
      return true;
    }
    if (key === 'kit:bind') {
      if (!locked()) { const r = call('bindLoadout', S, el.dataset.id, el.value || null); result(r); persist(); renderView(true); }
      return true;
    }
    return false;
  }
  // dot when the loadout chosen for the raid is incomplete or fails its role
  function badge(ctx) {
    sync(ctx);
    try {
      if (has('readinessFlags')) { const f = call('readinessFlags', S); if (f && f.level && f.notLocked) return true; if (f && f.failsRole) return true; }
      const plan = (S.raid && S.raid.plan) || {}; if (!plan.loadoutId || !S.loadouts) return false;
      const lv = S.loadouts.find((x) => x.id === plan.loadoutId); if (!lv) return false;
      if (SLOTS.some((sl) => lv.slots && lv.slots[sl] && !gearByUid(lv.slots[sl]))) return true;

  G.UI.screens.kit = {
    render: (ctx) => { sync(ctx); return vBag(); },
    badge,
    onAction,
    onInput,
    onSheetClose: (key) => { if (key === 'kitpick') ui.kitPick = null; },

})();
</script>
<script>
/* ==== ui/market.js ==== */
/* Guildwright screen module: market. See UI_CONTRACT.md. */
(function () {
  'use strict';
  const G = window.GW, H = G.UI.h, ui = H.ui;
  const { esc, call, fmt, fmtTime, clamp, act, item, skill, count, lvl, itemImg, miniURL, gdot, gradeChip, toast, openSheet, closeSheet, sheetFoot, markDirty, renderView, tossItems, persist, result, producer, updateLive, go, sellFrom } = H;
  let S, D; // refreshed from ctx on every entry point
  const sync = (c) => { S = c.S; D = c.D; return c; };

  // ---- crew hooks (engine section 7 / week buff; all guarded)
  function taxRate() { const t = H.has('marketTax') ? call('marketTax', S) : null; return typeof t === 'number' ? t : ((D.config && D.config.marketTax) || 0.05); }
  function taxBuff() { const b = H.has('weekBuff') ? call('weekBuff', S) : null; return b && b.kind === 'tax' ? b : null; }
  function needed() { return (H.has('neededByCrew') && call('neededByCrew', S)) || []; }
  function neededMap() { const m = {}; needed().forEach((n) => { if (!m[n.itemId] || n.rewardPer > m[n.itemId].rewardPer) m[n.itemId] = n; }); return m; }
  function buffChip() { const b = taxBuff(); return b ? '<span class="chip good" title="' + esc(b.label || '') + '">Win buff: tax ' + Math.round(taxRate() * 100) + '%</span>' : ''; }

  // ---- Market
  function vMarket() {
    let h = '<div class="seg" role="group" aria-label="Market section">' + [['buy', 'Buy'], ['sell', 'Sell'], ['supply', 'Supply board']].map(([k, n]) => '<button data-act="seg" data-id="' + k + '" aria-pressed="' + (ui.marketSeg === k) + '">' + n + '</button>').join('') + '</div>';
    if (ui.marketSeg === 'buy') h += vBuy(); else if (ui.marketSeg === 'sell') h += vSell(); else h += vSupply();
    return h;
  }
  function usefulSet() {
    const set = new Set();
    (D.actions || []).forEach((a) => { if (a.inputs && lvl(a.skill) >= a.level) Object.keys(a.inputs).forEach((id) => set.add(id)); });
    return set;
  }
  function buyGroups() {
    const ls = (S.market && S.market.listings) || [];
    const by = {};
    ls.forEach((l) => { (by[l.itemId] = by[l.itemId] || []).push(l); });
    const useful = usefulSet();
    return Object.entries(by).map(([id, list]) => ({ id, list: list.sort((a, b) => a.price - b.price), useful: useful.has(id) }))
      .sort((a, b) => (b.useful - a.useful) || item(a.id).name.localeCompare(item(b.id).name));
  }
  function vBuy() {
    const nm = neededMap(), nIds = Object.keys(nm), nOn = !!ui.marketNeeded, find = ui.marketFind;
    let groups = buyGroups();
    if (nOn) groups = groups.filter((g) => nm[g.id]);
    if (find) groups = groups.filter((g) => g.id === find);
    let h = '<section class="sec"><div class="sec-head"><h2>Listings</h2>' + (buffChip() || '<span class="eyebrow">Restocks every 2 min</span>') + '</div>';
    h += '<div class="filters" role="group" aria-label="Filter listings"><button class="fchip" data-act="market:need" data-id="0" aria-pressed="' + (!nOn) + '">All</button><button class="fchip" data-act="market:need" data-id="1" aria-pressed="' + nOn + '">Needed by crew' + (nIds.length ? ' · ' + nIds.length : '') + '</button>' +
      (find ? '<button class="fchip" data-act="market:clearFind" aria-pressed="true">' + esc(item(find).name) + ' ✕</button>' : '') + '</div>';
    if (nOn) {
      const missing = nIds.filter((id) => !groups.some((g) => g.id === id) && (!find || find === id));
      if (!groups.length && !missing.length) return h + '<div class="empty">The crew has no open requisitions. Officers post them on the Crew tab.</div></section>';
      h += '<div class="rows">' + groups.map(buyRow).join('') + missing.map((id) => { const pa = producer(id), n = nm[id];
        return '<div class="rowi slim dim">' + itemImg(id, 30) + '<span class="rn">' + esc(item(id).name) + ' <span class="chip">No listings</span></span><span class="rs">Crew needs ' + n.remaining + ' · ' + n.rewardPer + 'g each' + (pa ? ' · <button class="linkish" data-act="openSkill" data-id="' + esc(pa.skill) + '" data-open="' + esc(pa.id) + '">Make it ›</button>' : '') + '</span></div>'; }).join('') + '</div></section>';
      return h;
    }
    if (!groups.length && find) {
      const pa = producer(find), short = pa && lvl(pa.skill) < pa.level, nd = neededMap()[find];
      return h + '<div class="empty cw-nolist"><b>' + esc(item(find).name) + '</b>: no listings right now.' + (nd ? ' Crew pays ' + nd.rewardPer + 'g each.' : '') + '<div class="btn-row">' +
        (pa ? '<button class="btn small primary" data-act="openSkill" data-id="' + esc(pa.skill) + '" data-open="' + esc(pa.id) + '">' + (short ? 'Needs ' + esc(skill(pa.skill).name) + ' ' + pa.level : 'Make it') + '</button>' : '') +
        '<button class="btn small ghost" data-act="market:clearFind">Browse all</button><button class="btn small ghost" data-act="seg" data-id="supply">Supply board</button></div></div></section>';
    }
    if (!groups.length) return h + '<div class="empty">' + (find ? 'No listings for ' + esc(item(find).name) + ' right now.' : 'No listings right now. New sellers arrive every couple of minutes.') + '</div></section>';
    h += '<div class="rows">' + groups.map(buyRow).join('') + '</div></section>';
    return h;
  }
  function buyRow(g) {
    const nd = neededMap()[g.id];
    {
      const it = item(g.id), cheapest = g.list[0], qty = g.list.reduce((n, l) => n + l.qty, 0);
      const fair = call('itemValue', g.id, cheapest.grade) || 0, ratio = fair ? cheapest.price / fair : 1;
      const est = call('gatherEstimate', S, g.id);
      const badge = ratio <= 0.85 ? '<span class="chip good">Deal −' + Math.round((1 - ratio) * 100) + '%</span>' : ratio >= 1.35 ? '<span class="chip warnc">Pricey</span>' : '';
      return '<div class="rowi brow' + (g.useful ? '' : ' dim') + '">' + itemImg(g.id, 30) + '<span class="rn">' + esc(it.name) + ' ' + badge + (nd ? '<span class="chip accent" title="Open crew requisition">Crew pays ' + nd.rewardPer + 'g</span>' : '') + '</span>' +
        '<button class="btn small" data-act="buySheet" data-id="' + esc(g.id) + '"' + (S.gold >= cheapest.price ? '' : ' disabled') + '>Buy</button>' +
        '<span class="rs num">from <b class="gold-t">' + fmt(cheapest.price) + 'g</b> · ' + qty + ' for sale · ' + (est == null ? 'can’t gather yet' : '~' + esc(fmtTime(est)) + ' each to gather') + '</span></div>';
    }
  }
  function buySheet(id) {
    const g = buyGroups().find((x) => x.id === id);
    if (!g) { closeSheet(); return; }
    const est = call('gatherEstimate', S, id);
    let h = '<div class="sheet-head"><div class="btn-row">' + itemImg(id, 40) + '<div><h2>' + esc(item(id).name) + '</h2><span class="small muted">' + (est == null ? 'You can’t gather this yet' : '~' + esc(fmtTime(est)) + ' each to gather yourself') + ' · you have ' + fmt(count(id)) + '</span></div></div></div>';
    h += '<div class="rows">' + g.list.map((l) => {
      const fair = call('itemValue', id, l.grade) || 0;
      return '<div class="rowi">' + '<span class="rn">' + gradeChip(l.grade) + ' <span class="small muted">' + esc(l.seller) + ' · ' + l.qty + '</span></span>' +
        '<span class="rp"><b class="num gold-t">' + fmt(l.price) + 'g</b><small>fair ' + fmt(fair) + 'g</small></span>' +
        '<span class="ra"><button class="btn small" data-act="buy" data-id="' + esc(l.id) + '" data-qty="1"' + (S.gold >= l.price ? '' : ' disabled') + '>Buy 1</button>' +
        (l.qty > 1 ? '<button class="btn small primary" data-act="buy" data-id="' + esc(l.id) + '" data-qty="' + l.qty + '"' + (S.gold >= l.price * l.qty ? '' : ' disabled') + '>All ' + l.qty + ' · ' + fmt(l.price * l.qty) + 'g</button>' : '') + '</span></div>';
    }).join('') + '</div>';
    h += sheetFoot('<button class="btn wide" data-act="closeSheet" data-autofocus>Done</button>');
    ui.buyId = id;
    if (ui.sheet === 'buy') { const sh = document.querySelector('#sheetRoot .sheet'); if (sh) { sh.innerHTML = h; return; } }
    openSheet(h, 'buy');
  }
  function sellables() { return Object.keys(S.inv || {}).filter((id) => count(id) > 0).sort((a, b) => item(a).name.localeCompare(item(b).name)); }
  function normSell() {
    const s = ui.sell, list = sellables();
    if (!list.includes(s.itemId)) { s.itemId = list[0] || null; s.grade = null; s.price = null; }
    if (!s.itemId) return s;
    const g = S.inv[s.itemId] || [];
    if (s.grade == null || !g[s.grade]) { s.grade = -1; g.forEach((n, i) => { if (n > 0) s.grade = i; }); s.price = null; }
    const have = g[s.grade] || 0;
    s.qty = clamp(Math.round(s.qty || 1), 1, Math.max(1, have));
    if (!s.price) s.price = Math.max(1, Math.round(call('itemValue', s.itemId, s.grade) || 1));
    return s;
  }
  function sellEstimate(s) {
    const fair = call('itemValue', s.itemId, s.grade) || 1;
    const c = 0.08 * Math.pow(clamp(fair / Math.max(1, s.price), 0, 2), 3);
    return c > 0 ? 1 / c : Infinity;
  }
  function sellHint(s, est, tax) {
    return 'At this price one sells about every ' + esc(fmtTime(est)) + '. You get <b class="num">' + fmt(Math.floor(s.price * (1 - tax))) + 'g</b> each after tax.';
  }
  function vSell() {
    const s = normSell();
    const tax = taxRate();
    const mine = (S.market && S.market.mine) || [];
    const listings = '<section class="sec"><div class="sec-head"><h2>Your listings</h2><span class="eyebrow">' + mine.length + ' active</span></div>' +
      (mine.length ? '<div class="rows">' + mine.map((l) => '<div class="rowi">' + itemImg(l.itemId, 30) + '<span class="rn">' + esc(item(l.itemId).name) + ' ' + gradeChip(l.grade) + '</span>' +
        '<span class="rp"><b class="num gold-t">' + fmt(l.price) + 'g</b><small>each</small></span><span class="rs num">' + l.qty + ' left · ~' + esc(fmtTime(sellEstimate(l))) + ' per sale</span>' +
        '<span class="ra"><button class="btn small ghost" data-act="cancelListing" data-id="' + esc(l.id) + '">Cancel</button></span></div>').join('') + '</div>' : '<div class="empty">Nothing listed. Buyers fill listings over time; cheaper sells faster.</div>') + '</section>';
    let form = '<section class="sec"><div class="sec-head"><h2>List an item</h2>' + (buffChip() || '<span class="eyebrow">' + Math.round(tax * 100) + '% tax</span>') + '</div>';
    if (!s.itemId) form += '<div class="empty">Your bag is empty. Gather something first.</div>';
    else {
      const g = S.inv[s.itemId] || [];
      const fair = call('itemValue', s.itemId, s.grade) || 0;
      form += '<form class="form" id="sellForm" data-form="sell"><div class="strip" role="listbox" aria-label="Item to sell">' + sellables().map((id) =>
        '<button type="button" class="tile' + (id === s.itemId ? ' sel' : '') + '" data-act="sellPick" data-id="' + id + '" aria-selected="' + (id === s.itemId) + '" title="' + esc(item(id).name) + '">' + itemImg(id, 28) + '<span class="num">' + fmt(count(id)) + '</span></button>').join('') + '</div>' +
        '<p class="small"><b>' + esc(item(s.itemId).name) + '</b></p>' +
        '<div class="gchips">' + (D.grades || []).map((gr, i) => g[i] ? '<button type="button" class="gpick' + (i === s.grade ? ' sel' : '') + '" data-act="sellGrade" data-id="' + i + '" aria-pressed="' + (i === s.grade) + '">' + gdot(i) + esc(gr.name) + ' <span class="num">' + g[i] + '</span></button>' : '').join('') + '</div>' +
        '<div class="grid2"><div class="field"><label for="sellQty">Quantity</label><input id="sellQty" type="number" inputmode="numeric" min="1" max="' + (g[s.grade] || 1) + '" value="' + s.qty + '" data-in="sellQty"></div>' +
        '<div class="field"><label for="sellPrice">Price each</label><input id="sellPrice" type="number" inputmode="numeric" min="1" value="' + s.price + '" data-in="sellPrice"></div></div>' +
        '<div class="fair"><span>Fair <b class="num">' + fmt(fair) + 'g</b></span><span class="btn-row"><button type="button" class="btn small ghost" data-act="price" data-f="0.8">−20%</button><button type="button" class="btn small ghost" data-act="price" data-f="1">Fair</button><button type="button" class="btn small ghost" data-act="price" data-f="1.25">+25%</button></span></div>' +
        '<p class="hint" id="sellHint">' + sellHint(s, sellEstimate(s), tax) + '</p>' +
        '<button class="btn primary wide" type="submit">List ' + s.qty + ' for ' + fmt(s.price * s.qty) + 'g</button></form>';
    }
    form += '</section>';
    return mine.length ? listings + form : form + listings;
  }
  function vSupply() {
    const sp = S.supply || { requests: [], donated: {} };
    let h = '<section class="sec"><div class="sec-head"><h2>Week ' + (sp.week || S.week) + ' requests</h2><button class="linkish" data-act="supplyInfo" aria-expanded="' + !!ui.supplyInfo + '">How it pays ⓘ</button></div>';
    if (ui.supplyInfo) h += '<p class="hint">The supply board is the only place that pays coin outright, plus 1 raid token per 50g earned. Each item pays full rate for the first 50 this week, half up to 200, then a fifth.</p>';
    const reqs = (sp.requests || []).slice().sort((a, b) => (count(b.itemId) > 0) - (count(a.itemId) > 0));
    if (!reqs.length) return h + '<div class="empty">The board is empty this week.</div></section>';
    const listed = new Set(((S.market && S.market.listings) || []).map((l) => l.itemId));
    h += '<div class="rows">' + reqs.map((r) => {
      const have = count(r.itemId), done = (sp.donated && sp.donated[r.itemId]) || 0;
      const head = itemImg(r.itemId, 30) + '<span class="rn">' + esc(item(r.itemId).name) + (r.counter ? ' <span class="chip warnc">Raid counter</span>' : '') + '</span>';
      if (!have) {
        const pa = producer(r.itemId);
        const link = listed.has(r.itemId) ? '<button class="linkish" data-act="buySheet" data-id="' + esc(r.itemId) + '">Buy ›</button>'
          : pa ? '<button class="linkish" data-act="openSkill" data-id="' + esc(pa.skill) + '" data-open="' + esc(pa.id) + '">' + esc(skill(pa.skill).name) + ' ' + pa.level + ' ›</button>' : '';
        return '<div class="rowi slim">' + head + '<span class="rp"><b class="num gold-t">' + fmt(r.rate) + 'g</b><small>each</small></span><span class="rs">' + (done ? 'Donated ' + fmt(done) + ' · ' : 'You have none · ') + link + '</span></div>';
      }
      let q = ui.donate[r.itemId]; if (q == null) q = Math.min(have, 10); q = clamp(q, 0, have); ui.donate[r.itemId] = q;
      const quote = q ? (call('supplyQuote', S, r.itemId, q) || { coins: 0, tokens: 0 }) : { coins: 0, tokens: 0 };
      return '<div class="rowi">' + head + '<span class="rp"><b class="num gold-t">' + fmt(r.rate) + 'g</b><small>each</small></span>' +
        '<span class="rs num">You have ' + fmt(have) + (done ? ' · donated ' + fmt(done) : '') + '</span>' +
        '<span class="ra"><span class="stepper"><button data-act="donStep" data-id="' + r.itemId + '" data-d="-1" aria-label="Fewer">−</button><output class="num">' + q + '</output><button data-act="donStep" data-id="' + r.itemId + '" data-d="1" aria-label="More">+</button></span>' +
        '<button class="chip-btn" data-act="donMax" data-id="' + r.itemId + '">Max</button>' +
        '<button class="btn small primary" data-act="donate" data-id="' + r.itemId + '"' + (q ? '' : ' disabled') + '>Donate · ' + fmt(quote.coins) + 'g' + (quote.tokens ? ' +' + quote.tokens + 't' : '') + '</button></span></div>';
    }).join('') + '</div>';
    return h + '</section>';
  }

  function onAction(a, el, ctx, e) {
    sync(ctx);
    const id = el.dataset.id;
    switch (a) {
      case 'sellFrom': closeSheet(); go('market'); ui.marketSeg = 'sell'; ui.sell = { itemId: id, grade: null, qty: 1, price: null }; renderView(true); return true;
      case 'supplyFrom': closeSheet(); go('market'); ui.marketSeg = 'supply'; renderView(true); return true;
      case 'market:need': ui.marketNeeded = id === '1'; if (ui.marketNeeded) ui.marketFind = null; renderView(true); return true;
      case 'market:clearFind': ui.marketFind = null; renderView(true); return true;
      case 'seg': ui.marketSeg = id; renderView(true); return true;
      case 'supplyInfo': ui.supplyInfo = !ui.supplyInfo; renderView(true); return true;
      case 'buySheet': if (ui.tab !== 'market' || ui.marketSeg !== 'buy') { go('market', { keepScroll: true }); ui.marketSeg = 'buy'; renderView(true); } buySheet(id); return true;
      case 'buy': {
        const l = ((S.market && S.market.listings) || []).find((x) => String(x.id) === id);
        const q = Number(el.dataset.qty) || 1;
        if (result(call('buy', S, l ? l.id : id, q))) { persist(); if (l) { H.bump('kit', q); H.bumpKitIcon(); toast(itemImg(l.itemId, 22) + '<span>Bought ' + q + ' ' + esc(item(l.itemId).name) + ' · −' + fmt(l.price * q) + 'g</span>', '', 1800); } }
        renderView(true); updateLive(); if (ui.sheet === 'buy' && ui.buyId) buySheet(ui.buyId); return true;
      }
      case 'sellPick': ui.sell = { itemId: id, grade: null, qty: 1, price: null }; renderView(true); return true;
      case 'sellGrade': ui.sell.grade = Number(id); ui.sell.price = null; renderView(true); return true;
      case 'price': { const s = normSell(); s.price = Math.max(1, Math.round((call('itemValue', s.itemId, s.grade) || 1) * Number(el.dataset.f))); renderView(true); return true; }
      case 'cancelListing': { const l = ((S.market && S.market.mine) || []).find((x) => String(x.id) === id); result(call('cancelListing', S, l ? l.id : id)); renderView(true); return true; }
      case 'donStep': { const have = count(id); ui.donate[id] = clamp((ui.donate[id] || 0) + Number(el.dataset.d) * (e && e.shiftKey ? 10 : 1), 0, have); renderView(true); return true; }
      case 'donMax': ui.donate[id] = count(id); renderView(true); return true;
      case 'donate': {
        const q = ui.donate[id] || 0; const r = call('donate', S, id, q);
        if (result(r)) { ui.donate[id] = null; persist(); tossItems([{ url: miniURL('coin') }].concat(r.tokens ? [{ url: miniURL('token') }] : [])); toast('<span>Donated ' + q + ' ' + esc(item(id).name) + ' · <b>+' + fmt((r && r.coins) || 0) + 'g</b>' + (r && r.tokens ? ', +' + r.tokens + ' token' + (r.tokens > 1 ? 's' : '') : '') + '</span>'); }
        renderView(true); updateLive(); return true;
      }
      default: return false;
    }
  }
  function refreshSellHint() {
    const s = ui.sell, h = H.$('sellHint'); if (!h || !s.itemId) return;
    const tax = taxRate();
    h.innerHTML = sellHint(s, sellEstimate(s), tax);
    const btn = document.querySelector('#sellForm button[type="submit"]'); if (btn) btn.textContent = 'List ' + s.qty + ' for ' + fmt(s.price * s.qty) + 'g';
  }
  function onInput(k, el, e, ctx) {
    sync(ctx);
    const s = ui.sell;
    if (k === 'sellQty') { s.qty = Math.max(1, Math.round(Number(el.value) || 1)); refreshSellHint(); return true; }
    if (k === 'sellPrice') { s.price = Math.max(1, Math.round(Number(el.value) || 1)); refreshSellHint(); return true; }
    return false;
  }
  function onSubmit(form, e, ctx) {
    sync(ctx);
    if (form.dataset.form !== 'sell') return false;
    e.preventDefault();
    const s = normSell();
    const r = call('list', S, s.itemId, s.grade, s.qty, s.price);
    if (result(r, itemImg(s.itemId, 22) + '<span>Listed ' + s.qty + ' ' + esc(item(s.itemId).name) + ' at ' + fmt(s.price) + 'g</span>')) { ui.sell.qty = 1; persist(); }
    if (document.activeElement) document.activeElement.blur();
    renderView(true);
    return true;
  }
  G.UI.screens.market = {
    render: (ctx) => { sync(ctx); return vMarket(); },
    badge: () => 0,
    onAction, onInput, onSubmit,
    live: (ctx) => { // restock: redraw the listings when the market refreshes
      const mk = ctx.S.market && ctx.S.market.refreshedAt;
      if (mk !== ui.lastMarketAt) { ui.lastMarketAt = mk; markDirty(); }
    },
  };
})();
</script>
<script>
/* ==== ui/raid.js ==== */
/* Guildwright screen module: raid (J3). See UI_CONTRACT.md + ENGINE_API.md §2–§7.
   Pages (ui.raidPage): pre (weekday home) · prep (lock-in) · fight (diorama replay) · recap (key screen) · debrief.
   Other tabs can land on the lock-in screen with: H.ui.raidPage = 'prep'; H.go('raid'). */
(function () {
  'use strict';
  const G = window.GW, H = G.UI.h, ui = H.ui;
  const { $, esc, call, fmt, pct, cap, clamp, item, itemImg, img, charC, bossC, miniURL, shade, markDirty, renderView, setText, setP, persist, toast, go, durTxt, reduceMotion, gearByUid, confirmHTML } = H;
  let S, D, E;
  const sync = (c) => { S = c.S; D = c.D; E = c.E || H.E; return c; };
  // engine calls: guarded (missing fn -> undefined, no warning spam); state-first
  const has = (n) => !!(E && typeof E[n] === 'function');
  const Q = (n, ...a) => (has(n) ? call(n, S, ...a) : undefined);
  const Q0 = (n, ...a) => (has(n) ? call(n, ...a) : undefined);

  const CK = {
    mitigation: { label: 'Defence', col: '#4f7fd6' },
    healing: { label: 'Healing', col: '#3fa66a' },
    damage: { label: 'Damage', col: '#d4573c' },
    food: { label: 'Food', col: '#c99a2e' },
    consumables: { label: 'Potions', col: '#8a63c9' },
  };
  const ckLabel = (k) => (CK[k] ? CK[k].label : cap(k || ''));
  const TIER = { none: 'No tier', bronze: 'Bronze', silver: 'Silver', gold: 'Gold' };
  const sp = (x) => { const p = (Number(x) || 0) * 100; if (p === 0) return '0%'; if (p < 0.01) return '<0.01%'; if (p < 1) return p.toFixed(2) + '%'; if (p < 10) return p.toFixed(1) + '%'; return Math.round(p) + '%'; };
  const p1 = (x, up) => { const v = clamp(Number(x) || 0, 0, 1) * 100; const r = (up ? Math.ceil(v * 10 - 1e-6) : Math.floor(v * 10 + 1e-6)) / 10; return (r % 1 ? r.toFixed(1) : String(r)) + '%'; };
  const down = (x) => p1(x, false), left = (x) => p1(x, true);
  const ICO = {
    lock: '<svg class="rd-ico" viewBox="0 0 8 9" aria-hidden="true"><rect x="2" y="0" width="4" height="1"/><rect x="1" y="1" width="1" height="3"/><rect x="6" y="1" width="1" height="3"/><rect x="0" y="4" width="8" height="5"/></svg>',
    play: '<svg class="rd-ico" viewBox="0 0 7 8" aria-hidden="true"><rect x="0" y="0" width="2" height="8"/><rect x="2" y="1" width="2" height="6"/><rect x="4" y="2" width="2" height="4"/><rect x="6" y="3" width="1" height="2"/></svg>',
    back: '<svg class="rd-ico rd-chev" viewBox="0 0 5 9" aria-hidden="true"><rect x="3" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="1"/><rect x="1" y="3" width="2" height="1"/><rect x="0" y="4" width="2" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="2" y="6" width="2" height="1"/><rect x="3" y="7" width="2" height="2"/></svg>',
  };

  // ---------------------------------------------------------------------------------------------
  // reads
  const rules = () => (S.raid && S.raid.rules) || { eatAt: 0.5, stance: 'balanced', tactic: 'focus', tokens: 0 };
  const roles = () => Q0('raidRoles') || D.raidRoles || [];
  const roleDef = (id) => roles().find((r) => r.id === id) || { id, name: cap(id || 'Striker'), check: null };
  const stances = () => D.stances || [{ id: 'aggressive', name: 'Aggressive' }, { id: 'balanced', name: 'Balanced' }, { id: 'defensive', name: 'Defensive' }];
  const tactics = () => D.tactics || [];
  function clockInfo() { return Q('clock', Date.now()) || H.clock(); }
  const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const hh = (h) => String(h).padStart(2, '0') + ':00';
  function windowTxt() { // crew raid schedule, read-only here (edited in Crew)
    const sc = (S.crew && S.crew.schedule) || {};
    if (sc.startDay != null) return DAY[sc.startDay] + ' ' + hh(sc.startHour) + ' – ' + DAY[sc.endDay != null ? sc.endDay : 0] + ' ' + hh(sc.endHour != null ? sc.endHour : 22);
    const w = Q('raidWindow', Date.now());
    if (w && w.start) { const a = new Date(w.start), b = new Date(w.end); return DAY[a.getDay()] + ' ' + hh(a.getHours()) + ' – ' + DAY[b.getDay()] + ' ' + hh(b.getHours()); }
    return 'Sat 10:00 – Sun 22:00';
  }
  function nextRaidIn() { // after this week's raid: countdown to next week's window
    const ck = clockInfo();
    if (ck.state === 'done' && ck.short) return ck.short; // engine: 'Raid done · next in 5d 2h'
    if (!ck.raidDone && !ck.live) return ck.short || ck.label;
    if (ck.nextRaidStart) return 'Next raid in ' + durTxt(ck.nextRaidStart - (ck.now || Date.now()));
    const w = Q('raidWindow', Date.now() + 7 * 86400000), now = Q('now') || Date.now();
    return w && w.start > now ? 'Next raid in ' + durTxt(w.start - now) : 'Next raid next week';
  }
  function status() {
    const st = Q('raidStatus');
    if (st) return st;
    const lock = S.raid && S.raid.lock;
    return { week: S.week, phase: lock ? 'locked' : 'prep', locked: !!lock, lock, resolved: false, canStartNow: true };
  }
  function intel() {
    const I = Q('bossIntel');
    if (I) return I;
    const boss = Q('currentBoss') || (D.bosses || [])[0] || {};
    const maxHp = boss.hp || 1, hpLeft = (S.raid && S.raid.bossHp) != null ? S.raid.bossHp : maxHp;
    const hpPct = clamp(hpLeft / maxHp, 0, 1);
    return { boss, name: boss.name, title: boss.title, revealed: true, weakTo: boss.weakTo, hits: boss.hits, phases: (boss.phases || []).map((p) => ({ name: p.name, check: p.check, label: ckLabel(p.check) })),
      maxHp, hpLeft, hpPct, damageDealtPct: 1 - hpPct, checkpoints: [0.25, 0.5, 0.75].map((at) => ({ at, reached: 1 - hpPct >= at })), weekends: 0, carryOver: hpPct < 1 };
  }
  function recaps() { return Q('recaps') || (S.raid && S.raid.recaps) || []; }
  function recapById(id) { const all = recaps(); return all.find((r) => r.id === id) || (id == null ? all[0] : null) || null; }
  function latestRecap() { return Q('lastRecap') || recaps()[0] || null; }
  function bossDef(id) { return (D.bosses || []).find((b) => b.id === id) || Q('currentBoss') || (D.bosses || [])[0] || {}; }
  function playerSprite(role) {
    if (role && H.CHAR[role]) return role;
    const w = gearByUid((S.equipped || {}).weapon), r = w && item(w.itemId).role;
    return r && H.CHAR[r] ? r : 'striker';
  }
  function crewSprites() {
    const ms = ((S.crew && S.crew.members) || []).filter((m) => !m.isYou && m.id !== 'you');
    const out = [];
    ms.forEach((m) => { if (out.length < 3) out.push(H.CHAR[m.role] ? m.role : ['guardian', 'mender', 'striker'][out.length % 3]); });
    while (out.length < 3) out.push(['guardian', 'mender', 'striker'][out.length]);
    return out;
  }
  const itemsLine = (list) => (list || []).filter((x) => x && x.qty).map((x) => '<span class="rd-it">' + itemImg(x.itemId, 18) + '<span>' + fmt(x.qty) + ' ' + esc(item(x.itemId).name) + '</span></span>').join('') || '<span class="faint">–</span>';

  // ---------------------------------------------------------------------------------------------
  // shared bits
  function hpBar(after, before, id) { // fractions of max HP left: red = left, brass = dealt this weekend, hatched = earlier weekends
    const a = clamp(after, 0, 1), b = clamp(before == null ? after : before, a, 1);
    return '<div class="rd-hp"' + (id ? ' id="' + id + '"' : '') + ' style="--a:' + a.toFixed(4) + ';--b:' + b.toFixed(4) + '" role="img" aria-label="Boss HP ' + left(a) + ' left">' +
      '<i class="hl"></i><i class="wk"></i><i class="old"></i>' + [0.25, 0.5, 0.75].map((x) => '<i class="tk" style="left:' + x * 100 + '%"></i>').join('') + '</div>';
  }
  function setHp(elm, after) { if (elm) elm.style.setProperty('--a', clamp(after, 0, 1).toFixed(4)); }
  function chestTiles(dealt, cps, newAts) { // dealt = damage fraction so far; newAts = chests paid by this recap's weekend
    return '<div class="rd-chests">' + [0.25, 0.5, 0.75].map((at) => {
      const cp = (cps || []).find((c) => Math.abs(c.at - at) < 0.001) || {};
      const isNew = (newAts || []).some((x) => Math.abs(x - at) < 0.001);
      const got = isNew || cp.reached || dealt >= at - 1e-9;
      const st = isNew ? '<b class="ok">In your bag</b>' : got ? '<b class="muted">' + (newAts ? 'Earlier' : 'Opened') + '</b>' : '<b class="faint">' + left(Math.max(0.001, at - dealt)) + ' to go</b>';
      return '<div class="' + (isNew ? 'new' : got ? 'got' : '') + '"><span class="eyebrow">' + at * 100 + '% chest</span>' + st + '</div>';
    }).join('') + '</div>';
  }
  function ladderDots() {
    const L = Q('ladder');
    const list = L || (D.bosses || []).map((b, i) => ({ bossId: b.id, name: b.name, index: i, status: i < ((S.raid && S.raid.ladder) || 0) ? 'killed' : i === ((S.raid && S.raid.ladder) || 0) ? 'current' : 'locked' }));
    return '<ol class="rd-ladder" aria-label="Boss ladder">' + list.map((b) => '<li class="' + esc(b.status) + '" title="' + esc(b.name) + '"><span class="sr">' + esc(b.name) + ': ' + esc(b.status) + '</span></li>').join('') + '</ol>';
  }
  const backBtn = (to, label) => '<button class="rd-back linkish" data-act="raid:page" data-id="' + to + '">' + ICO.back + esc(label) + '</button>';
  const pf = (ok, txt) => '<span class="chip ' + (ok ? 'good' : 'lock') + '">' + esc(txt || (ok ? 'Pass' : 'Fail')) + '</span>';

  // ---------------------------------------------------------------------------------------------
  // page: pre-raid (weekday home)
  function pPre() {
    const I = intel(), st = status(), ck = clockInfo(), boss = I.boss || {};
    const n = (D.bosses || []).length, idx = (I.record && I.record.index != null ? I.record.index : (S.raid && S.raid.ladder) || 0) + 1;
    let h = '<section class="rd-head"><div class="rd-ht"><span class="eyebrow">Week ' + esc(ck.week || S.week) + ' · Boss ' + idx + ' of ' + n + '</span><h2>' + esc(I.name || boss.name) + '</h2></div>' +
      '<span class="rd-count chip num' + (ck.live ? ' accent' : '') + '" id="rdCount">' + esc(st.resolved ? nextRaidIn() : ck.short || ck.label) + '</span>' +
      '<p class="rd-sched faint small">Crew raid ' + esc(windowTxt()) + ((Q('can', 'setSchedule') || {}).ok ? ' · <button class="linkish" data-act="raid:crew">Change in Crew</button>' : '') + '</p></section>';
    // boss card
    h += '<section class="rd-card rd-boss" style="--bossbg:' + esc(shade((boss.palette || ['#333'])[0], -0.35)) + '"><div class="portrait">' + img(bossC(boss).url, 88) + '</div><div class="bi">' + ladderDots() +
      (I.revealed !== false && I.weakTo ? '<div class="chips"><span class="chip good">Weak to ' + esc(I.weakTo) + '</span>' + (I.hits ? '<span class="chip warnc">Hits with ' + esc(I.hits) + '</span>' : '') + '</div>' : '<span class="chip">Weakness revealed Monday</span>') +
      '<ol class="rd-phases">' + (I.phases || []).map((p) => '<li class="ck-' + esc(p.check) + '"><i class="ckdot"></i><b>' + esc(p.name) + '</b><span>' + esc(ckLabel(p.check)) + '</span></li>').join('') + '</ol></div></section>';

  let badgeCache = null;

  // ---------------------------------------------------------------------------------------------

      }
      case 'raid:lb': ui.raidLb = !ui.raidLb; rerender(); return true;
      case 'raid:lbBoard': ui.raidLbBoard = id; rerender(); return true;
      case 'raid:lbMode': ui.raidLbMode = id; rerender(); return true;
      case 'raid:checksAll': ui.raidChecksAll = !ui.raidChecksAll; rerender(); return true;

  }

  };
})();
