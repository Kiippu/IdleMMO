    if (a.kind === 'combat') {
      const e = a.enemy || {};
      h += '<p class="small">' + esc(e.name) + ' · power ' + (e.power || 0) + ' · hits for ~' + (e.dmg || 0) + '</p>';
      h += '<p class="small muted">' + (a.coins ? a.coins[0] + '–' + a.coins[1] + 'g per kill · ' : '') + int(mastery) + ' kills · auto-eats below half HP (' + kindCount('food') + ' food)</p>';
    } else {
      const bits = [mastery ? 'Done ' + int(mastery) + '×' : 'Not made yet'];
      if (go) bits.push(statLine(go.stats || {}) + (go.element ? ' · ' + cap(go.element) : ''));
      h += '<p class="small muted">' + esc(bits.join(' · ')) + '</p>';
    }
    if (go) {
      const po = call('procOdds', S, a.id);
      if (po) {
        const rp = (po.odds || []).filter((o) => rIdx(o.rarity) >= 2).reduce((n, o) => n + (o.chance || 0), 0);
        const pity = po.pity || { count: 0, threshold: 40 };
        h += '<div class="odds-line"><span>Rare+ <b class="num">' + pct(rp) + '</b></span><span class="pity-mini" title="Pity ' + pity.count + '/' + pity.threshold + '">Pity <span class="num">' + pity.count + '/' + pity.threshold + '</span><span class="meter thin brass"><i style="--p:' + clamp(pity.count / (pity.threshold || 1), 0, 1).toFixed(3) + '"></i></span></span>' +
          '<button class="linkish" data-act="odds" data-id="' + a.id + '">Odds ›</button></div>';
      }
    }
    if (!running) {
      const cs = call('canStart', S, a.id) || { ok: false, reason: 'Unavailable.' };
      const reps = call('maxRepeats', S, a.id);
      const first = !S.active && !Object.keys(S.mastery || {}).length;
      h += '<div class="btn-row"><button class="btn primary' + (first && cs.ok ? ' pulse' : '') + '" data-act="start" data-id="' + a.id + '"' + (cs.ok ? '' : ' disabled') + '>Start' + (cs.ok && a.inputs && reps != null && isFinite(reps) ? ' · ×' + reps : '') + '</button>' +
        (cs.ok ? '' : '<span class="reason">' + esc(cs.reason) + '</span>') + '</div>';
    }
    return h + '</div>';
  }
  function oddsSheet(actionId, refresh) {
    const a = act(actionId); const po = a && call('procOdds', S, actionId); if (!po) return;
    ui.oddsId = actionId;
    const odds = po.odds || [];
    const top = Math.max(0.0001, ...odds.map((o) => o.chance || 0));
    let h = '<div class="sheet-head"><div><span class="eyebrow">Rarity odds</span><h2>' + esc(a.name) + '</h2></div></div><div class="odds">';
    rarities().forEach((r, i) => {
      const o = odds.find((x) => rIdx(x.rarity) === i); const c = o ? (o.chance || 0) : 0;
      h += '<div class="odds-row r-' + r.id + (c ? '' : ' zero') + '"><span class="nm">' + esc(r.name) + '</span><span class="meter"><i style="--p:' + Math.max(c ? 0.015 : 0, c / top).toFixed(3) + '"></i></span><span class="pc">' + pct(c) + '</span></div>';
    });
    h += '</div>';
    const m = po.mods || {};
    const modList = [['Mastery', m.mastery], ['Material quality', m.quality], ['Steady hand', m.focus]];
    if (m.catalystItem || (m.catalyst && m.catalyst !== 1)) modList.push([m.catalystItem ? item(m.catalystItem).name : 'Catalyst', m.catalyst]);
    h += '<div class="mods">' + modList.filter(([, v]) => v != null).map(([k, v]) => '<span class="chip">' + esc(k) + ' <b>' + mult(v) + '</b></span>').join('') +
      (m.coreActive ? '<span class="chip accent">Core <b>Mythic on</b></span>' : '') + '<span class="chip total">Rare+ <b>' + mult(m.total) + '</b></span></div>';
    h += '<p class="hint">Steady hand builds while you watch a craft (up to ×1.2) and fades when you look away.</p>';
    const mt = po.masteryTier || {};
    const nextTxt = mt.next == null ? '' : (typeof mt.next === 'object' ? ' · ' + esc(mt.next.name || '') + ' at ' + int(mt.next.crafts) : ' · next tier at ' + int(mt.next));
    h += '<p class="small">Mastery <b>' + esc(mt.name || 'Novice') + '</b> · ' + int(mt.crafts || 0) + ' crafts' + nextTxt + '</p>';
    const pity = po.pity || { count: 0, threshold: 40 };
    h += '<div class="pity"><span class="eyebrow">Pity</span><span class="meter brass"><i style="--p:' + clamp(pity.count / (pity.threshold || 1), 0, 1).toFixed(3) + '"></i></span><span class="num small">' + pity.count + '/' + pity.threshold + '</span></div>';
    h += '<p class="hint">After ' + pity.threshold + ' crafts without a Rare or better, the next one is guaranteed Rare+.</p>';
    const cats = kindCount('catalyst'), cores = kindCount('core');
    if (cats || cores) h += '<div class="toggles">' + (cats ? switchRow('useCatalyst', 'Use a catalyst', cats + ' owned · strongest one is spent') : '') + (cores ? switchRow('useCore', 'Use a boss core', cores + ' owned · unlocks Mythic') : '') + '</div>';
    h += matPrefRow();
    h += sheetFoot('<button class="btn wide" data-act="closeSheet" data-autofocus>Done</button>');
    if (refresh && ui.sheet === 'odds') { const sh = document.querySelector('#sheetRoot .sheet'); if (sh) { sh.innerHTML = h; return; } }
    openSheet(h, 'odds');
  }

  function onAction(a, el, ctx) {
    sync(ctx);
    const id = el.dataset.id;
    switch (a) {
      case 'back': ui.skill = null; renderView(true); return true;
      case 'moreLocked': ui.allLocked = ui.allLocked || {}; ui.allLocked[id] = true; renderView(true); return true;
      case 'crewToggle': ui.crewOpen = !ui.crewOpen; renderView(true); return true;
      case 'toggleAction': ui.openAction = ui.openAction === id ? null : id; renderView(true); return true;
      case 'odds': oddsSheet(id); return true;
      case 'start': if (result(call('start', S, id))) { persist(); if (ui.hint && ui.hint.id === id) ui.hint = null; } renderView(true); updateLive(); return true;
      case 'assist': if (result(call('assist', S, id))) persist(); renderView(true); updateLive(); return true;
      default: return false;
    }
  }
  G.UI.screens.workshop = {
    render: (ctx) => { sync(ctx); return vSkills(); },
    badge: () => 0,
    onAction,
    mount: (ctx) => { sync(ctx); updateRowLive(); if (ui.sheet === 'odds' && ui.oddsId) oddsSheet(ui.oddsId, true); },
    live: (ctx) => { sync(ctx); updateCrewLive(); updateRowLive(); },
    // used by the shell (hints, level banner, supply links): open a skill page, choosing the best recipe to show
    autoOpen: (sid, ctx) => { sync(ctx); return autoOpen(sid); },
  };
})();
</script>

</body></html>
